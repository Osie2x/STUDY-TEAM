/* =========================================================
   MA123 Lab 6 — Determinants  ::  Styles
   Big, clean, calm. One thing in focus at a time.
========================================================= */
:root {
  --bg: #0f1226;
  --bg2: #151a36;
  --panel: #ffffff;
  --ink: #1a1f36;
  --ink-soft: #51597a;
  --line: #e7e9f3;
  --brand: #5b6cff;
  --brand-deep: #3b46d6;
  --accent: #ff8a4c;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --gold: #f5b301;
  --gold-soft: #fff3cf;
  --shadow: 0 18px 50px rgba(20, 24, 60, 0.18);
  --radius: 20px;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Inter", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 85% -10%, #2a2f63 0%, transparent 55%),
    radial-gradient(900px 500px at -5% 110%, #21264f 0%, transparent 55%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 26px;
  background: rgba(15, 18, 38, 0.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.brand { display: flex; align-items: center; gap: 14px; color: #fff; }
.brand-mark {
  font-family: var(--mono); font-weight: 600; font-size: 20px;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  width: 44px; height: 44px; border-radius: 13px;
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 18px; letter-spacing: .2px; }
.brand-text small { color: #aab0d8; font-size: 12px; }

/* ---------- layout ---------- */
.layout {
  display: grid;
  grid-template-columns: 268px 1fr;
  gap: 26px;
  max-width: 1320px;
  margin: 26px auto;
  padding: 0 26px 90px;
}

/* ---------- sidebar ---------- */
.sidebar {
  position: sticky; top: 86px; align-self: start;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius);
  padding: 16px 12px;
  max-height: calc(100vh - 110px);
  overflow: auto;
}
.sidebar-title {
  color: #c7ccef; font-size: 12px; text-transform: uppercase;
  letter-spacing: 1.4px; font-weight: 700; padding: 4px 10px 12px;
}
.stage-map { display: flex; flex-direction: column; gap: 4px; }
.map-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; text-align: left; cursor: pointer;
  background: transparent; border: 0; color: #d8dbf2;
  padding: 9px 10px; border-radius: 12px; font-size: 14px;
  transition: background .15s, transform .1s;
}
.map-item:hover { background: rgba(255, 255, 255, 0.07); }
.map-item.active { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff; box-shadow: var(--shadow); }
.map-item.stage-start { margin-top: 10px; }
.map-icon {
  width: 28px; height: 28px; border-radius: 9px; flex: none;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: rgba(255, 255, 255, 0.1);
}
.map-item.active .map-icon { background: rgba(255, 255, 255, 0.22); }
.map-text { display: flex; flex-direction: column; line-height: 1.2; flex: 1; }
.map-title { font-weight: 600; }
.map-sub { font-size: 11px; opacity: .7; }
.map-check { color: #7ef0b0; font-weight: 700; }
.map-item.complete .map-icon { background: var(--green-soft); color: var(--green); }
.sidebar-foot { color: #8c92bd; font-size: 11.5px; padding: 14px 10px 4px; line-height: 1.5; }

/* ---------- content cards ---------- */
.content { min-width: 0; }
.card {
  background: var(--panel); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 34px 38px; margin-bottom: 20px;
}
.hero { padding: 44px 46px; }
.kicker {
  color: var(--brand-deep); font-weight: 700; font-size: 13px;
  letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 8px;
}
h1 { font-family: "Fraunces", serif; font-size: 46px; line-height: 1.05; margin: 0 0 14px; letter-spacing: -.5px; }
h2 { font-family: "Fraunces", serif; font-size: 32px; margin: 0 0 6px; letter-spacing: -.3px; color: #fff; }
h3 { font-family: "Fraunces", serif; font-size: 23px; margin: 0 0 10px; }
.lede { font-size: 19px; color: var(--ink-soft); line-height: 1.55; max-width: 60ch; }

.meta-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0; }
.meta-pill {
  background: #f3f4fb; color: var(--ink); border: 1px solid var(--line);
  padding: 9px 15px; border-radius: 999px; font-size: 14px; font-weight: 500;
}
.how { background: #f7f8ff; border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; margin-top: 8px; }
.how h3 { margin-top: 0; }
.how ul { margin: 0; padding-left: 20px; line-height: 1.7; color: var(--ink-soft); }
.how b { color: var(--ink); }
.recommend { margin-top: 18px; font-size: 15px; color: var(--ink-soft); }

/* node headers sit on the dark bg */
.node-head { color: #fff; margin: 4px 4px 18px; }
.node-head .kicker { color: #aab0ff; }
.node-head .tagline, .tagline { color: #c2c7ee; font-size: 17px; line-height: 1.5; max-width: 70ch; }

/* ---------- two-panel stage layout ---------- */
.stage-grid {
  display: grid; grid-template-columns: 1.05fr .95fr; gap: 0;
  background: var(--panel); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; min-height: 440px;
}
.panel { padding: 30px 32px; }
.text-panel { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.viz-panel { background: linear-gradient(160deg, #f7f8ff, #eef0fb); display: grid; place-items: center; }

/* ---------- step player ---------- */
.step-dots { display: flex; gap: 7px; margin-bottom: 18px; }
.dot { width: 26px; height: 6px; border-radius: 99px; background: var(--line); transition: background .25s; }
.dot.on { background: var(--brand); }
.step-title { font-family: "Fraunces", serif; font-size: 20px; font-weight: 600; margin-bottom: 12px; color: var(--brand-deep); }
.step-body { font-size: 18px; line-height: 1.62; color: var(--ink); flex: 1; }
.step-body b { color: var(--ink); }
.step-body ul { padding-left: 18px; }
.step-nav { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
.step-counter { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: auto; }

.prob-intro { font-size: 18px; line-height: 1.6; margin: 12px 0 0; }

/* ---------- buttons ---------- */
.btn {
  font-family: inherit; font-size: 15px; font-weight: 600;
  border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  transition: transform .1s, box-shadow .15s, background .15s; color: #fff;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); box-shadow: 0 10px 24px rgba(91, 108, 255, .35); }
.btn.primary:hover { box-shadow: 0 14px 30px rgba(91, 108, 255, .45); }
.btn.accent { background: linear-gradient(135deg, var(--accent), #f2682f); box-shadow: 0 10px 24px rgba(255, 138, 76, .35); }
.btn.ghost { background: #eef0fb; color: var(--ink); }
.btn.ghost:hover { background: #e2e5f6; }
.btn.big { font-size: 17px; padding: 15px 28px; }
.btn.tiny { font-size: 12.5px; padding: 7px 12px; border-radius: 9px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.idk { background: #fff4e6; color: #b45309; border: 1px dashed #f0b878; margin-top: 10px; width: 100%; }
.btn.idk:hover { background: #ffedd6; }

.node-foot { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.ok-note { background: var(--green-soft); color: #136a37; padding: 12px 16px; border-radius: 12px; font-weight: 500; }

/* ---------- guided controls ---------- */
.guided-controls { margin-top: 18px; }
.guided-progress { display: flex; gap: 8px; margin-bottom: 14px; }
.gdot {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.08); color: #fff; font-weight: 700; cursor: pointer; font-size: 15px;
}
.gdot.on { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); border-color: transparent; }
.gdot.seen { background: var(--green-soft); color: var(--green); border-color: transparent; }
.guided-btnrow { display: flex; flex-wrap: wrap; gap: 12px; }

/* ---------- source tags ---------- */
.src-tag {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .3px;
  padding: 4px 11px; border-radius: 999px; margin-bottom: 4px;
}
.tag-lab { background: var(--gold-soft); color: #8a6400; }
.tag-book { background: #e8edff; color: var(--brand-deep); }
.tag-pred { background: #ffe9e0; color: #c2410c; }

/* ---------- matrix visualizer ---------- */
.viz-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
.viz-empty { font-size: 54px; opacity: .35; }
.mx {
  display: inline-grid; gap: 7px; padding: 14px;
  background: #fff; border-radius: 16px; box-shadow: 0 8px 22px rgba(30,40,90,.1);
  border: 1px solid var(--line);
  position: relative;
}
.mx-cell {
  font-family: var(--mono); font-size: 22px; font-weight: 600;
  width: 50px; height: 50px; display: grid; place-items: center;
  background: #f5f6fc; border-radius: 10px; color: var(--ink);
  transition: all .25s;
}
.mx-cell.hl { background: var(--gold); color: #1a1300; transform: scale(1.12); box-shadow: 0 6px 16px rgba(245,179,1,.5); z-index: 2; }
.mx-cell.dim { opacity: .22; }
.mx-cell.diag { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(91,108,255,.4); }
.mx-cell.green { background: var(--green-soft); color: var(--green); }
.mx-cell.red { background: var(--red-soft); color: var(--red); }
.mx-cell.changed { background: #fff3cf; color: #8a6400; }
.mx-cell.sign { font-size: 26px; }
.mx-cell.sign.pos { color: var(--green); background: var(--green-soft); }
.mx-cell.sign.neg { color: var(--red); background: var(--red-soft); }

.viz-legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip { font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px; background: #eef0fb; color: var(--ink-soft); }
.chip.green { background: var(--green-soft); color: var(--green); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.diag-chip { background: #e8edff; color: var(--brand-deep); }
.viz-arrow { color: var(--ink-soft); font-size: 14px; font-weight: 600; }
.viz-minor-wrap { display: flex; align-items: center; gap: 12px; }
.sign-badge { font-size: 30px; font-weight: 800; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.sign-badge.pos { background: var(--green-soft); color: var(--green); }
.sign-badge.neg { background: var(--red-soft); color: var(--red); }
.viz-result { font-family: "Fraunces", serif; font-size: 30px; font-weight: 700; color: var(--brand-deep); background: #fff; padding: 10px 22px; border-radius: 14px; box-shadow: var(--shadow); }

/* row operation viz */
.rowop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.rowop-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 120px; }
.rowop-op { font-size: 15px; }
.rowop-arrow { font-size: 26px; color: var(--ink-soft); }
.rowop-effect { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
.effect-ok { background: var(--green-soft); color: var(--green); }
.effect-flip { background: var(--red-soft); color: var(--red); }
.effect-scale { background: var(--gold-soft); color: #8a6400; }
.sign-grid .mx-cell { width: 44px; height: 44px; }

/* ---------- gate cards ---------- */
.gate { text-align: center; padding: 44px; }
.gate-icon { font-size: 50px; margin-bottom: 6px; }
.gate p { color: var(--ink-soft); font-size: 16px; line-height: 1.6; max-width: 52ch; margin: 10px auto; }
.gate .warn { color: var(--red); font-weight: 700; background: var(--red-soft); display: inline-block; padding: 9px 18px; border-radius: 12px; }
.gate .btn { margin-top: 18px; }
.gate.review { border-top: 4px solid var(--brand); }
.gate.boss { border-top: 4px solid var(--gold); }

/* ---------- gauntlet modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 12, 30, 0.82); backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 24px; overflow: auto;
}
.modal {
  background: var(--panel); border-radius: 24px; box-shadow: var(--shadow);
  width: min(760px, 100%); padding: 30px 34px; max-height: 92vh; overflow: auto;
}
.modal-top { display: flex; justify-content: space-between; align-items: center; color: var(--ink-soft); font-size: 13px; font-weight: 600; }
.modal-context { color: var(--brand-deep); text-transform: uppercase; letter-spacing: 1px; }
.lock-note { margin: 14px 0; background: #fff4e6; color: #b45309; font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 10px; text-align: center; }
.qcard { background: #f7f8ff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
.qprompt { font-size: 20px; line-height: 1.5; }
.qmatrix { text-align: center; font-size: 20px; margin-top: 8px; }

.answer-zone { margin-top: 20px; }
.num-row { display: flex; gap: 10px; }
.num-input {
  flex: 1; font-family: var(--mono); font-size: 20px; padding: 14px 16px;
  border: 2px solid var(--line); border-radius: 12px; outline: none;
}
.num-input:focus { border-color: var(--brand); }
.tf-row { display: flex; gap: 12px; }
.tf-row .choice { flex: 1; }
.mc-list { display: flex; flex-direction: column; gap: 10px; }
.btn.choice { background: #eef0fb; color: var(--ink); font-size: 17px; padding: 16px 18px; text-align: left; border: 2px solid transparent; }
.btn.choice:hover { border-color: var(--brand); background: #e6e9fb; }
.btn.choice.mc { font-family: var(--mono); }

/* feedback */
.feedback { margin-top: 18px; display: none; }
.feedback.show { display: block; }
.feedback.ok-fb { color: var(--green); font-size: 22px; font-weight: 700; }
.feedback.bad-fb { color: var(--red); font-size: 18px; font-weight: 700; }
.feedback.warn-fb { color: #b45309; font-weight: 600; }
.spacer { height: 14px; }
.reteach { margin-top: 14px; background: #f7f8ff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; color: var(--ink); font-weight: 400; font-size: 16px; }
.reteach-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.reteach-viz { display: grid; place-items: center; background: #fff; border-radius: 14px; padding: 14px; min-height: 160px; }
.reteach-plain { line-height: 1.6; }

/* ---------- wrong-answer tracker ---------- */
.tracker { position: fixed; right: 22px; bottom: 22px; z-index: 40; width: 320px; max-width: calc(100vw - 44px); }
.tracker-toggle {
  width: 100%; background: linear-gradient(135deg, #ff7a59, #ef4444); color: #fff;
  border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 14px;
  cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
}
.tracker-badge { margin-left: auto; background: rgba(255,255,255,.25); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.tracker-card { display: none; background: #fff; border-radius: 16px; box-shadow: var(--shadow); margin-top: 8px; overflow: hidden; }
.tracker.open .tracker-card { display: block; }
.tracker-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.tracker-body { max-height: 40vh; overflow: auto; padding: 8px; }
.tracker-empty { padding: 20px; text-align: center; color: var(--ink-soft); font-weight: 600; }
.tracker-empty span { font-weight: 400; font-size: 13px; display: block; margin-top: 6px; }
.tracker-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; }
.tracker-row:hover { background: #f5f6fc; }
.tracker-label { color: var(--ink); }
.tracker-n { color: var(--red); font-weight: 700; }

/* ---------- animation ---------- */
.fade { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; flex-direction: row; }
  .stage-map { flex-direction: row; flex-wrap: wrap; }
  .map-item { width: auto; }
  .map-sub, .sidebar-foot, .sidebar-title { display: none; }
  .stage-grid { grid-template-columns: 1fr; }
  .text-panel { border-right: 0; border-bottom: 1px solid var(--line); }
  h1 { font-size: 36px; }
}
@media (max-width: 560px) {
  .card, .hero { padding: 24px 22px; }
  .panel { padding: 22px; }
  .mx-cell { width: 42px; height: 42px; font-size: 18px; }
}

    <script>
//<![CDATA[
/* ===================================================================
   MA123 Lab 6 — Determinants Engine
   Pure math: determinant computation + verified step-by-step solution
   generators + interactive-matrix visualization state builders.

   Everything in here is data-in / data-out. The UI layer (app.js)
   turns the returned "step" objects into the on-screen step player.
   Keeping the math here means every guided walkthrough AND every
   auto-generated practice/reteach solution is guaranteed correct.
=================================================================== */

const Engine = (() => {
  /* ---------- number formatting helpers ---------- */
  const fmt = (n) => {
    // pass strings (symbolic entries like "x") straight through
    if (typeof n !== "number") return String(n);
    // keep small fractions readable, otherwise integers
    if (Number.isInteger(n)) return String(n);
    const r = Math.round(n * 1000) / 1000;
    return String(r);
  };
  // wrap negatives in parentheses for clean multiplication display
  const paren = (n) => (n < 0 ? `(${fmt(n)})` : fmt(n));

  /* ---------- matrix helpers ---------- */
  const clone = (M) => M.map((row) => row.slice());
  const size = (M) => M.length;

  const minor = (M, i, j) =>
    M.filter((_, r) => r !== i).map((row) => row.filter((_, c) => c !== j));

  // recursive determinant via first-row cofactor expansion (exact for ints)
  const det = (M) => {
    const n = M.length;
    if (n === 1) return M[0][0];
    if (n === 2) return M[0][0] * M[1][1] - M[0][1] * M[1][0];
    let total = 0;
    for (let j = 0; j < n; j++) {
      const sign = j % 2 === 0 ? 1 : -1;
      total += sign * M[0][j] * det(minor(M, 0, j));
    }
    return total;
  };

  /* ---------- LaTeX matrix rendering ---------- */
  // kind: 'b' => bmatrix (brackets), 'v' => vmatrix (det bars)
  const latexMatrix = (M, kind = "b", highlight = null) => {
    const env = kind === "v" ? "vmatrix" : "bmatrix";
    const body = M.map((row, r) =>
      row
        .map((val, c) => {
          let cell = fmt(val);
          if (
            highlight &&
            highlight.r === r &&
            (highlight.c === undefined || highlight.c === c)
          ) {
            cell = `\\boxed{${cell}}`;
          }
          return cell;
        })
        .join(" & ")
    ).join(" \\\\ ");
    return `\\begin{${env}}${body}\\end{${env}}`;
  };

  const tex = (s) => `\\(${s}\\)`;
  const texBlock = (s) => `\\[${s}\\]`;

  /* ===================================================================
     STEP GENERATORS
     A "step" = { title, html, viz } where viz is an optional config the
     visualizer in app.js can render (highlighting / crossing out cells).
  =================================================================== */

  /* ----- 2x2 determinant, fully worked ----- */
  const steps2x2 = (M) => {
    const [[a, b], [c, d]] = M;
    const result = a * d - b * c;
    return {
      result,
      steps: [
        {
          title: "Set up the 2×2 rule",
          html: `A 2×2 determinant is the <b>down-diagonal product minus the up-diagonal product</b>.
                 ${texBlock(`\\det${latexMatrix(M, "b")} = ad - bc`)}`,
          viz: { type: "two", M, phase: "setup" },
        },
        {
          title: "Mark the diagonals",
          html: `Green diagonal (top-left → bottom-right) is <b>+ad</b>.
                 Red diagonal (top-right → bottom-left) is <b>−bc</b>.`,
          viz: { type: "two", M, phase: "diagonals" },
        },
        {
          title: "Substitute the numbers",
          html: texBlock(
            `\\det(A) = (${fmt(a)})(${fmt(d)}) - (${fmt(b)})(${fmt(c)})`
          ),
          viz: { type: "two", M, phase: "diagonals" },
        },
        {
          title: "Compute",
          html: texBlock(
            `\\det(A) = ${fmt(a * d)} - (${fmt(b * c)}) = \\mathbf{${fmt(
              result
            )}}`
          ),
          viz: { type: "two", M, phase: "result", result },
        },
      ],
    };
  };

  /* ----- 3x3 determinant by cofactor expansion along row 0 ----- */
  const steps3x3 = (M, expandRow = 0) => {
    const n = 3;
    const row = expandRow;
    const result = det(M);
    const steps = [];

    steps.push({
      title: "Choose a row to expand along",
      html: `We use <b>cofactor expansion along row ${row + 1}</b>.
             The sign pattern (checkerboard) starts with + at the top-left:
             ${texBlock(`\\begin{matrix} + & - & + \\\\ - & + & - \\\\ + & - & + \\end{matrix}`)}
             Each term is <b>entry × sign × (determinant of the leftover 2×2)</b>.`,
      viz: { type: "cofactor", M, row, phase: "intro" },
    });

    const termPieces = [];
    for (let j = 0; j < n; j++) {
      const entry = M[row][j];
      const sgn = (row + j) % 2 === 0 ? 1 : -1;
      const sub = minor(M, row, j);
      const subDet = det(sub);
      const term = sgn * entry * subDet;
      termPieces.push({ entry, sgn, sub, subDet, term, j });

      steps.push({
        title: `Term ${j + 1}: cover row ${row + 1}, column ${j + 1}`,
        html: `Take the entry ${tex(fmt(entry))}. Its position sign is
               <b>${sgn === 1 ? "+" : "−"}</b>. Delete its row and column — the
               leftover 2×2 is its <b>minor</b>:
               ${texBlock(
                 `${sgn === 1 ? "+" : "-"}\\,(${paren(entry)})\\cdot${latexMatrix(
                   sub,
                   "v"
                 )}`
               )}`,
        viz: {
          type: "cofactor",
          M,
          row,
          phase: "term",
          col: j,
          sign: sgn,
          minor: sub,
        },
      });
    }

    // compute each 2x2 minor
    steps.push({
      title: "Evaluate each 2×2 minor",
      html: termPieces
        .map(
          (p) =>
            `${texBlock(
              `${latexMatrix(p.sub, "v")} = (${fmt(p.sub[0][0])})(${fmt(
                p.sub[1][1]
              )}) - (${fmt(p.sub[0][1])})(${fmt(p.sub[1][0])}) = ${fmt(p.subDet)}`
            )}`
        )
        .join(""),
      viz: { type: "cofactor", M, row, phase: "intro" },
    });

    // assemble
    const assembled = termPieces
      .map(
        (p) =>
          `${p.sgn === 1 ? "+" : "-"}\\,${paren(p.entry)}\\cdot(${fmt(
            p.subDet
          )})`
      )
      .join(" ");
    const numeric = termPieces
      .map((p) => `${p.term < 0 ? "-" : "+"}\\,${fmt(Math.abs(p.term))}`)
      .join(" ");

    steps.push({
      title: "Add the three terms",
      html: texBlock(`\\det(A) = ${assembled}`) +
            texBlock(`\\det(A) = ${numeric} = \\mathbf{${fmt(result)}}`),
      viz: { type: "cofactor", M, row, phase: "result", result },
    });

    return { result, steps };
  };

  /* ----- triangular determinant ----- */
  const stepsTriangular = (M) => {
    const n = M.length;
    const diag = M.map((row, i) => row[i]);
    const result = diag.reduce((a, b) => a * b, 1);
    return {
      result,
      steps: [
        {
          title: "Spot the triangular shape",
          html: `Every entry on one side of the main diagonal is 0, so this is a
                 <b>triangular matrix</b>. For triangular (and diagonal) matrices the
                 determinant is just the <b>product of the diagonal entries</b> — the
                 other entries do not matter at all.`,
          viz: { type: "diagonal", M, phase: "intro" },
        },
        {
          title: "Multiply the diagonal",
          html: texBlock(
            `\\det(A) = ${diag.map(paren).join(" \\cdot ")}`
          ),
          viz: { type: "diagonal", M, phase: "diag" },
        },
        {
          title: "Result",
          html: texBlock(`\\det(A) = \\mathbf{${fmt(result)}}`),
          viz: { type: "diagonal", M, phase: "result", result },
        },
      ],
    };
  };

  /* ===================================================================
     RANDOM PROBLEM GENERATORS  (for the practice gauntlet — infinite)
  =================================================================== */
  const ri = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const nz = (lo, hi) => {
    let v = 0;
    while (v === 0) v = ri(lo, hi);
    return v;
  };

  const gen2x2 = () => {
    const M = [
      [nz(-6, 6), ri(-6, 6)],
      [ri(-6, 6), nz(-6, 6)],
    ];
    return { M, answer: det(M), kind: "2x2" };
  };

  const gen3x3 = () => {
    // keep one zero in for friendlier arithmetic sometimes
    const M = [
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
    ];
    return { M, answer: det(M), kind: "3x3" };
  };

  const genTriangular = (n = 3) => {
    const M = Array.from({ length: n }, () => Array(n).fill(0));
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        if (j < i) M[i][j] = ri(-5, 5); // lower triangular fill
        else if (j === i) M[i][j] = nz(-4, 4);
      }
    return { M, answer: det(M), kind: "triangular" };
  };

  // 4x4 with a sparse row to reward smart expansion
  const genSparse4 = () => {
    const M = [
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
      [0, nz(-3, 3), 0, 0],
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
    ];
    return { M, answer: det(M), kind: "sparse4" };
  };

  /* ----- property / algebra question generators (Stage C & D) ----- */
  // det(kA) = k^n det(A)
  const genScalarMultiple = () => {
    const n = ri(2, 3);
    const d = nz(-6, 6);
    const k = nz(-3, 3);
    const answer = Math.pow(k, n) * d;
    return {
      kind: "scalar",
      n,
      k,
      d,
      answer,
      prompt: `\\(A\\) is an \\(${n}\\times ${n}\\) matrix with \\(\\det(A) = ${d}\\). Find \\(\\det(${k}A)\\).`,
      reteach: `Scaling <b>every</b> row of an \\(n\\times n\\) matrix by \\(k\\) multiplies the determinant by \\(k\\) once per row — and there are \\(n\\) rows. So \\(\\det(kA)=k^{n}\\det(A)\\), NOT \\(k\\det(A)\\). Here \\(n=${n}\\), \\(k=${k}\\): \\(\\det(${k}A) = (${k})^{${n}}\\cdot(${d}) = ${Math.pow(
        k,
        n
      )}\\cdot(${d}) = ${answer}.\\) Watch the sign: a negative \\(k\\) with odd \\(n\\) stays negative.`,
    };
  };
  // det(AB) = det(A)det(B)
  const genProduct = () => {
    const a = nz(-6, 6);
    const b = nz(-6, 6);
    return {
      kind: "product",
      answer: a * b,
      prompt: `\\(\\det(A) = ${a}\\) and \\(\\det(B) = ${b}\\). Find \\(\\det(AB)\\).`,
      reteach: `The determinant of a product is the product of the determinants: \\(\\det(AB)=\\det(A)\\det(B) = (${a})(${b}) = ${
        a * b
      }.\\) (Order does not matter for the determinant: \\(\\det(AB)=\\det(BA)\\).)`,
    };
  };
  // det(A^{-1}) = 1/det(A)
  const genInverse = () => {
    const choices = [2, -2, 4, -4, 5, -5, 1, -1];
    const a = choices[ri(0, choices.length - 1)];
    const ans = 1 / a;
    return {
      kind: "inverse",
      answer: ans,
      prompt: `\\(\\det(A) = ${a}\\). Find \\(\\det(A^{-1})\\). (Enter a fraction like 1/2 if needed.)`,
      reteach: `Since \\(\\det(A)\\det(A^{-1}) = \\det(I) = 1\\), we get \\(\\det(A^{-1}) = \\dfrac{1}{\\det(A)} = \\dfrac{1}{${a}}.\\)`,
    };
  };

  return {
    fmt,
    paren,
    clone,
    size,
    minor,
    det,
    latexMatrix,
    tex,
    texBlock,
    steps2x2,
    steps3x3,
    stepsTriangular,
    gen2x2,
    gen3x3,
    genTriangular,
    genSparse4,
    genScalarMultiple,
    genProduct,
    genInverse,
  };
})();

// generic cofactor expansion along an arbitrary row (for 4×4 sparse)
function stepsExpandAnyRow(M, row) {
  const n = M.length;
  const result = E.det(M);
  const steps = [];
  steps.push({
    title: `Expand along row ${row + 1}`,
    html: `Row ${row + 1} has the most zeros, so most terms die instantly.
      Surviving terms are <b>entry × sign × minor</b>.`,
    viz: { type: "cofactor", M, row, phase: "intro" },
  });
  for (let j = 0; j < n; j++) {
    const entry = M[row][j];
    if (entry === 0) continue;
    const sgn = (row + j) % 2 === 0 ? 1 : -1;
    const sub = E.minor(M, row, j);
    steps.push({
      title: `Nonzero entry in column ${j + 1}`,
      html: `${E.texBlock(
        `${sgn === 1 ? "+" : "-"}\\,(${E.paren(entry)})\\cdot${E.latexMatrix(
          sub,
          "v"
        )} = ${sgn === 1 ? "+" : "-"}\\,(${E.paren(entry)})\\cdot(${E.fmt(
          E.det(sub)
        )})`
      )}`,
      viz: { type: "cofactor", M, row, phase: "term", col: j, sign: sgn, minor: sub },
    });
  }
  steps.push({
    title: "Result",
    html: E.texBlock(`\\det(A) = \\mathbf{${E.fmt(result)}}`),
    viz: { type: "cofactor", M, row, phase: "result", result },
  });
  return { result, steps };
}

// effect-of-operation question
function genRowOpEffect() {
  const ops = [
    {
      text: (d) => `\\(B\\) is obtained from \\(A\\) by <b>swapping two rows</b>. If \\(\\det(A)=${d}\\), find \\(\\det(B)\\).`,
      f: (d) => -d,
      why: (d) => `Swapping two rows flips the sign: \\(\\det(B) = -\\det(A) = -(${d}) = ${-d}.\\)`,
    },
    {
      text: (d, k) => `\\(B\\) is obtained from \\(A\\) by <b>multiplying one row by ${k}</b>. If \\(\\det(A)=${d}\\), find \\(\\det(B)\\).`,
      f: (d, k) => d * k,
      why: (d, k) => `Scaling a single row by \\(k\\) scales the determinant by \\(k\\): \\(\\det(B)=${k}\\cdot(${d})=${d * k}.\\)`,
    },
    {
      text: (d, k) => `\\(B\\) is obtained from \\(A\\) by <b>adding ${k} times row 1 to row 2</b>. If \\(\\det(A)=${d}\\), find \\(\\det(B)\\).`,
      f: (d) => d,
      why: (d) => `Adding a multiple of one row to another <b>does not change</b> the determinant: \\(\\det(B)=\\det(A)=${d}.\\)`,
    },
  ];
  const o = ops[Math.floor(Math.random() * ops.length)];
  const d = ((Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 8) + 2));
  const k = Math.floor(Math.random() * 4) + 2;
  return {
    type: "numeric",
    source: "Lab 6 Notes",
    promptHtml: o.text(d, k),
    matrix: null,
    answer: o.f(d, k),
    reteachHtml: o.why(d, k),
  };
}

// instant-zero spotting (MC)
function genZeroSpot() {
  const zeroMats = [
    { M: [[2, 4], [1, 2]], why: "Row 2 is ½·Row 1 — proportional rows ⟹ det = 0." },
    { M: [[1, 2, 3], [0, 0, 0], [4, 5, 6]], why: "Row 2 is all zeros ⟹ det = 0." },
    { M: [[3, 1, 6], [2, 5, 4], [1, 7, 2]], why: "Column 3 = 2·Column 1 — proportional columns ⟹ det = 0." },
  ];
  const z = zeroMats[Math.floor(Math.random() * zeroMats.length)];
  const nzG = E.gen3x3();
  // ensure nonzero is actually nonzero
  let nzM = nzG.M, nzd = nzG.answer, guard = 0;
  while (nzd === 0 && guard++ < 20) {
    const g = E.gen3x3();
    nzM = g.M;
    nzd = g.answer;
  }
  const optionA = { html: E.texBlock(E.latexMatrix(z.M, "b")), correct: true, why: z.why };
  const optionB = {
    html: E.texBlock(E.latexMatrix(nzM, "b")),
    correct: false,
    why: `This one has \\(\\det = ${E.fmt(nzd)} \\neq 0\\) — it's invertible, not an instant zero.`,
  };
  const choices = Math.random() < 0.5 ? [optionA, optionB] : [optionB, optionA];
  return {
    type: "mc",
    source: "Textbook 4.2 style",
    promptHtml: `Which matrix has determinant <b>0</b> by inspection (no computation)?`,
    choices,
    answer: choices.findIndex((c) => c.correct),
  };
}

// find x making a 2×2 / triangular matrix singular
function genSingularParam() {
  const forms = [
    () => {
      const a = nzr(), b = nzr(), c = nzr();
      // [[a,b],[c,x]] singular: a*x - b*c = 0 -> x = b*c/a, choose a dividing
      let A = a, B = b, C = c;
      // make divisible
      const x = ((Math.floor(Math.random() * 5) + 1)) * (Math.random() < 0.5 ? -1 : 1);
      B = Math.random() < 0.5 ? B : B; // keep
      const prod = A * x; // we want a*x = b*c -> set c so b*c = a*x
      // pick b then c = a*x / b if divisible, else fallback
      let bb = nzr();
      // choose cc so bb*cc = A*x
      // ensure integer: pick cc as divisor
      let cc = null;
      for (let t = -6; t <= 6; t++) {
        if (t !== 0 && bb * t === A * x) { cc = t; break; }
      }
      if (cc === null) { bb = 1; cc = A * x; }
      const M = [[A, bb], [cc, "x"]];
      return {
        promptHtml: `For which value of \\(x\\) is this matrix <b>singular</b> (not invertible)? ${E.texBlock(E.latexMatrix(M, "b"))}`,
        answer: x,
        reteachHtml: `Singular ⟺ \\(\\det=0\\). Here \\(\\det = (${A})x - (${bb})(${cc}) = ${A}x - (${bb * cc})\\). Set \\(=0\\): \\(x = \\dfrac{${bb * cc}}{${A}} = ${x}.\\)`,
      };
    },
    () => {
      // triangular [[2,*,*],[0,x,*],[0,0,3]] singular when diagonal product 0 -> x=0
      const M = [[2, 4, 1], [0, "x", 5], [0, 0, 3]];
      return {
        promptHtml: `This upper-triangular matrix is singular for which \\(x\\)? ${E.texBlock(E.latexMatrix(M, "b"))}`,
        answer: 0,
        reteachHtml: `Triangular ⟹ \\(\\det = 2\\cdot x\\cdot 3 = 6x\\). It is 0 only when \\(x=0\\).`,
      };
    },
  ];
  const f = forms[Math.floor(Math.random() * forms.length)]();
  return { type: "numeric", source: "Predicted Lab Q", matrix: null, ...f };
}

function nzr() {
  let v = 0;
  while (v === 0) v = Math.floor(Math.random() * 11) - 5;
  return v;
}

// invertibility True/False traps
function genInvertTF() {
  const bank = [
    {
      s: "If \\(\\det(A)=0\\), then \\(A\\vec x=\\vec b\\) has infinitely many solutions.",
      ans: false,
      why: "False. \\(\\det(A)=0\\) means singular — the system has either NO solution or infinitely many; which one depends on \\(\\vec b\\). Counterexample: \\(\\begin{bmatrix}1&0\\\\0&0\\end{bmatrix}\\vec x=\\begin{bmatrix}0\\\\1\\end{bmatrix}\\) has no solution.",
    },
    {
      s: "If \\(\\det(A)\\neq 0\\), then the columns of \\(A\\) are linearly independent.",
      ans: true,
      why: "True. \\(\\det\\neq 0\\) is equivalent to invertibility, which is equivalent to linearly independent columns (and rank \\(=n\\), RREF \\(=I\\)).",
    },
    {
      s: "For an \\(n\\times n\\) matrix, \\(\\det(2A) = 2\\,\\det(A)\\).",
      ans: false,
      why: "False. \\(\\det(2A)=2^{n}\\det(A)\\). It equals \\(2\\det(A)\\) only when \\(n=1\\).",
    },
    {
      s: "\\(\\det(A^{T}) = \\det(A)\\) for every square matrix \\(A\\).",
      ans: true,
      why: "True (Thm 4.2.18). That's exactly why every row property has a column twin.",
    },
    {
      s: "If \\(A\\) has two identical rows, then \\(A\\) is invertible.",
      ans: false,
      why: "False. Two identical rows ⟹ \\(\\det = 0\\) ⟹ singular (not invertible).",
    },
    {
      s: "\\(\\det(AB) = \\det(BA)\\) even when \\(AB \\neq BA\\).",
      ans: true,
      why: "True. Both equal \\(\\det(A)\\det(B)\\); the determinant forgets non-commutativity.",
    },
    {
      s: "There is a rule \\(\\det(A+B) = \\det(A)+\\det(B)\\).",
      ans: false,
      why: "False. No such rule. Example: \\(\\det(I+I)=\\det(2I)=2^{n}\\neq 1+1\\) for \\(n\\ge 2\\).",
    },
  ];
  const q = bank[Math.floor(Math.random() * bank.length)];
  return {
    type: "tf",
    source: "Lab 6 Notes",
    promptHtml: q.s,
    answer: q.ans,
    reteachHtml: q.why,
  };
}

    <script>
//<![CDATA[
/* ===================================================================
   MA123 Lab 6 — Determinants  ::  APP (UI engine)
   Ties the curriculum + engine to the screen:
     • recommended path + free navigation
     • one-step-at-a-time step player
     • interactive matrix visualizations
     • the locked practice "gauntlet"
     • the wrong-answer tracker (persisted)
=================================================================== */

(() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* ---------- MathJax typesetting helper ----------
     MathJax v3 breaks (NaN-size SVGs) if typesetPromise calls overlap.
     We serialize every request through a single promise chain. */
  let mjQueue = Promise.resolve();
  function typeset(node) {
    if (!(window.MathJax && MathJax.typesetPromise)) return mjQueue;
    mjQueue = mjQueue
      .then(() => {
        if (node && MathJax.typesetClear) {
          try {
            MathJax.typesetClear([node]);
          } catch {}
        }
        return MathJax.typesetPromise(node ? [node] : undefined);
      })
      .catch(() => {});
    return mjQueue;
  }

  /* ---------- persistent state ---------- */
  const LS_KEY = "ma123_lab6_state_v1";
  const state = loadState();
  function loadState() {
    try {
      return (
        JSON.parse(localStorage.getItem(LS_KEY)) || {
          completed: {},
          wrongLog: [],
        }
      );
    } catch {
      return { completed: {}, wrongLog: [] };
    }
  }
  function saveState() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch {}
  }

  /* ---------- build the recommended path ---------- */
  const path = buildPath();
  let current = 0;

  function buildPath() {
    const nodes = [{ type: "intro", id: "intro", label: "Start here" }];
    CURRICULUM.stages.forEach((st) => {
      nodes.push({ type: "concept", id: `${st.id}-concept`, stage: st, label: `Learn` });
      nodes.push({ type: "guided", id: `${st.id}-guided`, stage: st, label: `Guided` });
      nodes.push({ type: "practice", id: `${st.id}-practice`, stage: st, label: `Practice` });
      const inter = CURRICULUM.interleave[`after${st.id}`];
      if (inter)
        nodes.push({
          type: "interleave",
          id: `${st.id}-interleave`,
          data: inter,
          label: "Review",
        });
    });
    nodes.push({ type: "mock", id: "mock", data: CURRICULUM.mock, label: "Boss" });
    nodes.push({ type: "done", id: "done", label: "Finish" });
    return nodes;
  }

  /* =================================================================
     MATRIX VISUALIZER
  ================================================================= */
  function matrixGrid(M, opts = {}) {
    const n = M.length;
    const cols = M[0].length;
    const grid = el("div", "mx");
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    M.forEach((row, r) => {
      row.forEach((val, c) => {
        const cell = el("div", "mx-cell", String(val));
        if (opts.highlight && opts.highlight.r === r && opts.highlight.c === c)
          cell.classList.add("hl");
        if (opts.dimRow === r) cell.classList.add("dim");
        if (opts.dimCol === c) cell.classList.add("dim");
        if (opts.diag && r === c) cell.classList.add("diag");
        if (opts.greenDiag && r === c) cell.classList.add("green");
        if (opts.redAnti && r + c === n - 1) cell.classList.add("red");
        if (opts.changedRows && opts.changedRows.includes(r))
          cell.classList.add("changed");
        grid.appendChild(cell);
      });
    });
    return grid;
  }

  function renderViz(container, viz) {
    container.innerHTML = "";
    if (!viz || viz.type === "none") {
      container.appendChild(el("div", "viz-empty", "🧮"));
      return;
    }
    const wrap = el("div", "viz-wrap fade");

    if (viz.type === "two") {
      const opts = {};
      if (viz.phase === "diagonals") {
        opts.greenDiag = true;
        opts.redAnti = true;
      }
      wrap.appendChild(matrixGrid(viz.M, opts));
      if (viz.phase === "diagonals") {
        const legend = el(
          "div",
          "viz-legend",
          `<span class="chip green">+ad (down →)</span><span class="chip red">− bc (up ↗)</span>`
        );
        wrap.appendChild(legend);
      }
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det = ${viz.result}`));
    } else if (viz.type === "cofactor") {
      const opts = {};
      if (viz.phase === "term") {
        opts.highlight = { r: viz.row, c: viz.col };
        opts.dimRow = viz.row;
        opts.dimCol = viz.col;
      }
      wrap.appendChild(matrixGrid(viz.M, opts));
      if (viz.phase === "term") {
        const arrow = el("div", "viz-arrow", "↓ delete its row &amp; column");
        wrap.appendChild(arrow);
        const minorWrap = el("div", "viz-minor-wrap");
        const sign = el(
          "span",
          `sign-badge ${viz.sign === 1 ? "pos" : "neg"}`,
          viz.sign === 1 ? "+" : "−"
        );
        minorWrap.appendChild(sign);
        minorWrap.appendChild(matrixGrid(viz.minor, {}));
        wrap.appendChild(minorWrap);
      }
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det(A) = ${viz.result}`));
    } else if (viz.type === "diagonal") {
      wrap.appendChild(matrixGrid(viz.M, { diag: true }));
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det = ${viz.result}`));
      else
        wrap.appendChild(
          el("div", "viz-legend", `<span class="chip diag-chip">multiply the diagonal</span>`)
        );
    } else if (viz.type === "signgrid") {
      const n = viz.n || 3;
      const grid = el("div", "mx sign-grid");
      grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++) {
          const s = (r + c) % 2 === 0 ? "+" : "−";
          const cell = el("div", `mx-cell sign ${s === "+" ? "pos" : "neg"}`, s);
          grid.appendChild(cell);
        }
      wrap.appendChild(grid);
      wrap.appendChild(
        el("div", "viz-legend", `<span class="chip">corners + center are +, edges are −</span>`)
      );
    } else if (viz.type === "rowop") {
      const row = el("div", "rowop");
      row.appendChild(matrixGrid(viz.before, {}));
      const mid = el("div", "rowop-mid");
      mid.appendChild(el("div", "rowop-op", `\\(${viz.op}\\)`));
      mid.appendChild(el("div", "rowop-arrow", "⟶"));
      const eff =
        viz.effect === "no change"
          ? "effect-ok"
          : viz.effect.includes("−1")
          ? "effect-flip"
          : "effect-scale";
      mid.appendChild(el("div", `rowop-effect ${eff}`, `det ${viz.effect}`));
      row.appendChild(mid);
      row.appendChild(matrixGrid(viz.after, {}));
      wrap.appendChild(row);
    } else if (viz.type === "matrixOnly") {
      wrap.appendChild(matrixGrid(viz.M, {}));
      if (viz.note) wrap.appendChild(el("div", "viz-legend", `<span class="chip">${viz.note}</span>`));
    }

    container.appendChild(wrap);
    typeset(container);
  }

  /* =================================================================
     STEP PLAYER  (one step at a time, Next/Back)
  ================================================================= */
  function stepPlayer(mountText, mountViz, steps, opts = {}) {
    let i = 0;
    const total = steps.length;

    const dots = el("div", "step-dots");
    for (let k = 0; k < total; k++) dots.appendChild(el("span", "dot"));

    const titleEl = el("div", "step-title");
    const bodyEl = el("div", "step-body");
    const nav = el("div", "step-nav");
    const back = el("button", "btn ghost", "‹ Back");
    const next = el("button", "btn primary", "Next step ›");
    const counter = el("span", "step-counter");
    nav.append(back, counter, next);

    mountText.innerHTML = "";
    mountText.append(dots, titleEl, bodyEl, nav);

    function render() {
      const s = steps[i];
      titleEl.textContent = `Step ${i + 1}. ${s.title}`;
      bodyEl.className = "step-body fade";
      bodyEl.innerHTML = s.html;
      // restart fade animation
      void bodyEl.offsetWidth;
      typeset(bodyEl);
      renderViz(mountViz, s.viz);
      counter.textContent = `${i + 1} / ${total}`;
      back.disabled = i === 0;
      [...dots.children].forEach((d, k) =>
        d.classList.toggle("on", k <= i)
      );
      next.textContent = i === total - 1 ? "Done ✓" : "Next step ›";
    }

    back.onclick = () => {
      if (i > 0) {
        i--;
        render();
      }
    };
    next.onclick = () => {
      if (i < total - 1) {
        i++;
        render();
      } else if (opts.onDone) {
        opts.onDone();
      }
    };
    render();
  }

  /* =================================================================
     NODE RENDERERS
  ================================================================= */
  const main = () => $("#main");

  function sourceTag(src) {
    const cls = src && src.includes("Lab 6") ? "tag-lab" : src && src.includes("Predicted") ? "tag-pred" : "tag-book";
    return `<span class="src-tag ${cls}">${src}</span>`;
  }

  function go(idx) {
    current = Math.max(0, Math.min(path.length - 1, idx));
    renderSidebar();
    renderNode(path[current]);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function markComplete(id) {
    state.completed[id] = true;
    saveState();
    renderSidebar();
  }

  function nextButton(label = "Continue ›") {
    const b = el("button", "btn primary big", label);
    b.onclick = () => go(current + 1);
    return b;
  }

  function renderNode(node) {
    const m = main();
    m.innerHTML = "";
    if (node.type === "intro") return renderIntro(m);
    if (node.type === "concept") return renderConcept(m, node);
    if (node.type === "guided") return renderGuided(m, node);
    if (node.type === "practice") return renderPractice(m, node, node.stage.practice, `Stage ${node.stage.id} · Practice`);
    if (node.type === "interleave") return renderInterleave(m, node);
    if (node.type === "mock") return renderMock(m, node);
    if (node.type === "done") return renderDone(m);
  }

  /* ----- intro ----- */
  function renderIntro(m) {
    const meta = CURRICULUM.meta;
    const card = el("div", "card hero");
    card.innerHTML = `
      <div class="kicker">${meta.course}</div>
      <h1>${meta.lab}</h1>
      <p class="lede">A guided, visual, by-hand workout for tomorrow's lab — built only from
        <b>${meta.book}</b>, scoped by your Lab 6 notes (<b>determinants</b>).</p>
      <div class="meta-row">
        <div class="meta-pill">⏱ Full run ≈ ${meta.estTotalMin} min</div>
        <div class="meta-pill">✅ Day-minimum at ≈ ${meta.dayMinMin} min (through Stage C)</div>
        <div class="meta-pill">🧠 ${CURRICULUM.stages.length} stages · spaced review · boss gauntlet</div>
      </div>
      <div class="how">
        <h3>How this works</h3>
        <ul>
          <li><b>Learn</b> each idea one card at a time — the matrix on the right shows exactly what changes.</li>
          <li><b>Guided</b>: 2–3 fully worked problems, revealed one step per click. Feel ready? Skip straight to practice.</li>
          <li><b>Practice = a locked gauntlet.</b> No AI, no internet, no calculator app. Type your answer or hit “I don't know.” Miss it and I reteach, then hand you a fresh one until it's locked.</li>
          <li><b>Interleaving</b>: after later stages, earlier skills pop back up so they actually stick.</li>
          <li>Everything you get wrong lands in the <b>Wrong-Answer Tracker</b> (bottom-right).</li>
        </ul>
      </div>
      <div class="recommend">
        <b>Recommended path:</b> just keep clicking <i>Continue</i>. Or jump anywhere from the map on the left.
      </div>
    `;
    m.appendChild(card);
    const cta = nextButton("Start Stage A ›");
    m.appendChild(cta);
    typeset(m);
  }

  /* ----- concept ----- */
  function renderConcept(m, node) {
    const st = node.stage;
    const head = el("div", "node-head");
    head.innerHTML = `<div class="kicker">Stage ${st.id} · Learn</div>
      <h2>${st.concept.title}</h2>
      <p class="tagline">${st.tagline}</p>`;
    m.appendChild(head);

    const stagewrap = el("div", "stage-grid");
    const left = el("div", "panel text-panel");
    const right = el("div", "panel viz-panel");
    stagewrap.append(left, right);
    m.appendChild(stagewrap);

    const steps = st.concept.cards.map((c, i) => ({
      title: i === 0 ? "Core idea" : `Build on it`,
      html: c.html,
      viz: c.viz || { type: "none" },
    }));

    stepPlayer(left, right, steps, {
      onDone: () => {
        markComplete(node.id);
        const foot = el("div", "node-foot");
        foot.appendChild(
          el("div", "ok-note", "Concept covered. Now lock it in with the guided problems.")
        );
        foot.appendChild(nextButton("Go to guided problems ›"));
        m.appendChild(foot);
        typeset(foot);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      },
    });
  }

  /* ----- guided ----- */
  function renderGuided(m, node) {
    const st = node.stage;
    const head = el("div", "node-head");
    head.innerHTML = `<div class="kicker">Stage ${st.id} · Guided</div>
      <h2>Worked problems — one step at a time</h2>
      <p class="tagline">${st.guided.intro}</p>`;
    m.appendChild(head);

    let gi = 0;
    const probs = st.guided.problems;

    const stagewrap = el("div", "stage-grid");
    const left = el("div", "panel text-panel");
    const right = el("div", "panel viz-panel");
    stagewrap.append(left, right);
    m.appendChild(stagewrap);

    const controls = el("div", "guided-controls");
    m.appendChild(controls);

    function loadProblem(idx) {
      gi = idx;
      const p = probs[idx];
      const built = p.build();
      // prepend a framing step that shows the problem
      const framing = {
        title: p.title,
        html: `${sourceTag(p.source)}<p class="prob-intro">${p.promptHtml}</p>`,
        viz: p.matrix ? { type: "matrixOnly", M: p.matrix, note: "" } : { type: "none" },
      };
      const steps = [framing, ...built.steps];
      stepPlayer(left, right, steps, {
        onDone: () => buildControls(true),
      });
      buildControls(false);
    }

    function buildControls(done) {
      controls.innerHTML = "";
      const dotline = el("div", "guided-progress");
      probs.forEach((p, k) => {
        const d = el("button", "gdot" + (k === gi ? " on" : "") + (k < gi ? " seen" : ""), String(k + 1));
        d.onclick = () => loadProblem(k);
        dotline.appendChild(d);
      });
      controls.appendChild(dotline);

      const row = el("div", "guided-btnrow");
      if (gi < probs.length - 1) {
        const nextProb = el("button", "btn primary", `Next worked problem (${gi + 2}/${probs.length}) ›`);
        nextProb.onclick = () => loadProblem(gi + 1);
        row.appendChild(nextProb);
      }
      // optional skip after 2 guided problems
      if (gi >= 1) {
        const skip = el("button", "btn accent", "I'm ready — skip to Practice ⏭");
        skip.onclick = () => {
          markComplete(node.id);
          go(current + 1);
        };
        row.appendChild(skip);
      }
      if (gi === probs.length - 1) {
        const toPractice = el("button", "btn primary big", "Start the Practice gauntlet ›");
        toPractice.onclick = () => {
          markComplete(node.id);
          go(current + 1);
        };
        row.appendChild(toPractice);
      }
      controls.appendChild(row);
    }

    loadProblem(0);
  }

  /* ----- practice (gauntlet) ----- */
  function renderPractice(m, node, practice, headline) {
    const head = el("div", "node-head");
    head.innerHTML = `<div class="kicker">${headline}</div>
      <h2>Practice gauntlet</h2>
      <p class="tagline">${practice.intro}</p>`;
    m.appendChild(head);

    const card = el("div", "card gate");
    card.innerHTML = `
      <div class="gate-icon">🔒</div>
      <h3>${practice.slots.length}-question gauntlet</h3>
      <p>Once you start, the page locks to one question at a time. Answer it (or press
        <b>I don't know</b>) to move on. Wrong answers get retaught and replaced with a
        fresh variant until you clear them.</p>
      <p class="warn">✋ No AI. No internet. No calculator app. Paper and brain only.</p>
    `;
    const startBtn = el("button", "btn primary big", "Begin gauntlet ▶");
    startBtn.onclick = () =>
      runGauntlet(practice.slots, headline, () => {
        markComplete(node.id);
        card.innerHTML = `<div class="gate-icon">✅</div><h3>Gauntlet cleared!</h3>
          <p>Every question answered correctly. Keep the momentum.</p>`;
        card.appendChild(nextButton());
        typeset(card);
      });
    card.appendChild(startBtn);
    m.appendChild(card);
    typeset(m);
  }

  /* ----- interleave ----- */
  function renderInterleave(m, node) {
    const d = node.data;
    const head = el("div", "node-head");
    head.innerHTML = `<div class="kicker">Spaced Review</div>
      <h2>${d.title}</h2>
      <p class="tagline">${d.blurb}</p>`;
    m.appendChild(head);
    const card = el("div", "card gate review");
    card.innerHTML = `<div class="gate-icon">🔁</div><h3>${d.slots.length} quick recall questions</h3>
      <p>Same locked rules. This is interleaving — proving old skills still fire when mixed in.</p>`;
    const b = el("button", "btn primary big", "Begin review ▶");
    b.onclick = () =>
      runGauntlet(d.slots, d.title, () => {
        markComplete(node.id);
        card.innerHTML = `<div class="gate-icon">✅</div><h3>Review cleared!</h3>`;
        card.appendChild(nextButton());
        typeset(card);
      });
    card.appendChild(b);
    m.appendChild(card);
    typeset(m);
  }

  /* ----- mock ----- */
  function renderMock(m, node) {
    const d = node.data;
    const head = el("div", "node-head");
    head.innerHTML = `<div class="kicker">Final</div><h2>${d.title}</h2>
      <p class="tagline">${d.blurb}</p>`;
    m.appendChild(head);
    const card = el("div", "card gate boss");
    card.innerHTML = `<div class="gate-icon">🏆</div><h3>${d.slots.length}-question boss gauntlet</h3>
      <p class="warn">✋ No AI. No internet. No calculator app. This is the dress rehearsal.</p>`;
    const b = el("button", "btn primary big", "Enter the boss gauntlet ▶");
    b.onclick = () =>
      runGauntlet(d.slots, d.title, () => {
        markComplete(node.id);
        card.innerHTML = `<div class="gate-icon">🎉</div><h3>Boss cleared — you're ready for the lab.</h3>`;
        card.appendChild(nextButton("See summary ›"));
        typeset(card);
      });
    card.appendChild(b);
    m.appendChild(card);
    typeset(m);
  }

  /* ----- done ----- */
  function renderDone(m) {
    const wrongCount = state.wrongLog.length;
    const card = el("div", "card hero");
    card.innerHTML = `<div class="kicker">Lab 6 · Determinants</div>
      <h1>You made it 🎓</h1>
      <p class="lede">You've covered cofactor expansion, triangular shortcuts, row operations,
        determinant algebra, and invertibility — all by hand.</p>
      <div class="meta-row">
        <div class="meta-pill">Stages cleared: ${CURRICULUM.stages.length}/${CURRICULUM.stages.length}</div>
        <div class="meta-pill">Logged misses: ${wrongCount}</div>
      </div>
      <p>Best last move before bed: open the <b>Wrong-Answer Tracker</b> and re-run any
        concept that shows up there. Then sleep — recall beats cramming.</p>`;
    m.appendChild(card);
    const row = el("div", "guided-btnrow");
    const restart = el("button", "btn ghost", "↺ Restart from the top");
    restart.onclick = () => go(0);
    const replayWrong = el("button", "btn accent", "Re-drill my missed concepts ▶");
    replayWrong.onclick = () => drillWrong();
    row.append(replayWrong, restart);
    m.appendChild(row);
    typeset(m);
  }

  /* =================================================================
     THE GAUNTLET  (locked modal, one question at a time)
  ================================================================= */
  function runGauntlet(slots, contextLabel, onAllDone) {
    const overlay = el("div", "overlay");
    document.body.appendChild(overlay);
    document.body.classList.add("locked");

    let slotIndex = 0;
    let cleared = 0;
    const totalSlots = slots.length;

    function nextSlot() {
      if (slotIndex >= totalSlots) {
        // finished
        overlay.remove();
        document.body.classList.remove("locked");
        onAllDone();
        return;
      }
      showProblem(slots[slotIndex]);
    }

    function showProblem(slot) {
      const prob = slot.generate();
      overlay.innerHTML = "";
      const modal = el("div", "modal fade");

      const top = el("div", "modal-top");
      top.innerHTML = `<div class="modal-context">${contextLabel}</div>
        <div class="modal-progress">Question ${slotIndex + 1} / ${totalSlots} · cleared ${cleared}</div>`;
      modal.appendChild(top);

      const lockNote = el("div", "lock-note", "🔒 Locked — no AI, no internet. Answer to continue.");
      modal.appendChild(lockNote);

      const qcard = el("div", "qcard");
      qcard.innerHTML = `${slot.source ? sourceTag(slot.source) : prob.source ? sourceTag(prob.source) : ""}
        <div class="qprompt">${prob.promptHtml || "Compute the determinant:"}</div>`;
      if (prob.matrix) {
        const mwrap = el("div", "qmatrix");
        mwrap.innerHTML = `\\[${Engine.latexMatrix(prob.matrix, "v")}\\]`;
        qcard.appendChild(mwrap);
      }
      modal.appendChild(qcard);

      const answerZone = el("div", "answer-zone");
      modal.appendChild(answerZone);

      const feedback = el("div", "feedback");
      modal.appendChild(feedback);

      overlay.appendChild(modal);
      typeset(modal);

      // test-only probe (active only with ?test=1 in the URL) so automated
      // tests can verify the correct-answer path. Never set during normal use.
      if (/[?&]test=1/.test(location.search)) window.__currentProb = prob;

      // build inputs per type
      if (prob.type === "tf") {
        const row = el("div", "tf-row");
        const tBtn = el("button", "btn choice", "TRUE");
        const fBtn = el("button", "btn choice", "FALSE");
        tBtn.onclick = () => judge(true === prob.answer, prob, feedback, answerZone, slot, true);
        fBtn.onclick = () => judge(false === prob.answer, prob, feedback, answerZone, slot, false);
        row.append(tBtn, fBtn);
        answerZone.appendChild(row);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
      } else if (prob.type === "mc") {
        const list = el("div", "mc-list");
        prob.choices.forEach((ch, k) => {
          const b = el("button", "btn choice mc", ch.html);
          b.onclick = () => judge(k === prob.answer, prob, feedback, answerZone, slot, k);
          list.appendChild(b);
        });
        answerZone.appendChild(list);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
        typeset(answerZone);
      } else {
        // numeric
        const row = el("div", "num-row");
        const input = el("input", "num-input");
        input.type = "text";
        input.setAttribute("inputmode", "text");
        input.placeholder = "your answer (e.g. -6 or 1/2)";
        const submit = el("button", "btn primary", "Submit");
        const tryJudge = () => {
          const v = parseNumeric(input.value);
          if (Number.isNaN(v)) {
            feedback.className = "feedback warn-fb show";
            feedback.textContent = "Type a number (integer, decimal, or a/b fraction).";
            return;
          }
          judge(approx(v, prob.answer), prob, feedback, answerZone, slot, input.value);
        };
        submit.onclick = tryJudge;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") tryJudge();
        });
        row.append(input, submit);
        answerZone.appendChild(row);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
        setTimeout(() => input.focus(), 50);
      }
    }

    function idkButton(prob, feedback, answerZone, slot) {
      const b = el("button", "btn idk", "I don't know");
      b.onclick = () => judge(false, prob, feedback, answerZone, slot, "IDK", true);
      return b;
    }

    function judge(correct, prob, feedback, answerZone, slot, picked, isIDK) {
      // disable inputs
      answerZone.querySelectorAll("button, input").forEach((n) => (n.disabled = true));
      if (correct) {
        feedback.className = "feedback ok-fb show";
        feedback.innerHTML = `✅ Correct.`;
        // if MC/correct, optionally show why
        const cont = el("button", "btn primary big", slotIndex + 1 >= totalSlots ? "Finish ✓" : "Next question ›");
        cont.onclick = () => {
          cleared++;
          slotIndex++;
          nextSlot();
        };
        feedback.appendChild(el("div", "spacer"));
        feedback.appendChild(cont);
      } else {
        // log the miss
        logWrong(prob, contextLabel);
        feedback.className = "feedback bad-fb show";
        feedback.innerHTML = isIDK
          ? `🟡 No problem — let's learn it. Here's the full reasoning:`
          : `❌ Not quite. Here's exactly how it works:`;
        const reteach = el("div", "reteach");
        renderReteach(reteach, prob);
        feedback.appendChild(reteach);

        const again = el("button", "btn primary big", "Got it — give me a fresh one ↻");
        again.onclick = () => showProblem(slot); // brand new variant, same slot
        feedback.appendChild(el("div", "spacer"));
        feedback.appendChild(again);
        typeset(feedback);
      }
    }

    nextSlot();
  }

  function renderReteach(container, prob) {
    if (prob.solution && prob.solution.steps) {
      // mini step player inside the reteach
      const wrap = el("div", "reteach-grid");
      const txt = el("div", "reteach-text");
      const viz = el("div", "reteach-viz");
      wrap.append(txt, viz);
      container.appendChild(wrap);
      stepPlayer(txt, viz, prob.solution.steps, {});
    } else if (prob.reteachHtml) {
      container.innerHTML = `<div class="reteach-plain">${prob.reteachHtml}</div>`;
      typeset(container);
    } else if (prob.type === "mc" && prob.choices) {
      const correct = prob.choices[prob.answer];
      container.innerHTML = `<div class="reteach-plain">Correct choice: <b>${correct.html}</b>${
        correct.why ? `<br>${correct.why}` : ""
      }</div>`;
      typeset(container);
    } else {
      container.innerHTML = `<div class="reteach-plain">The correct answer is <b>${prob.answer}</b>.</div>`;
    }
  }

  /* ---------- wrong-answer tracker ---------- */
  function logWrong(prob, context) {
    const label =
      prob.type === "tf"
        ? "True/False trap"
        : prob.type === "mc"
        ? "Concept choice"
        : prob.matrix
        ? "Determinant computation"
        : "Determinant property";
    state.wrongLog.unshift({
      label,
      source: prob.source || "—",
      context,
      when: Date.now(),
    });
    if (state.wrongLog.length > 60) state.wrongLog.pop();
    saveState();
    renderTracker();
  }

  function renderTracker() {
    const panel = $("#tracker-body");
    if (!panel) return;
    const log = state.wrongLog;
    $("#tracker-count").textContent = log.length;
    if (!log.length) {
      panel.innerHTML = `<div class="tracker-empty">No misses yet. 🎯<br><span>Anything you miss in a gauntlet lands here so you can re-drill it.</span></div>`;
      return;
    }
    // group by label+context
    const groups = {};
    log.forEach((w) => {
      const key = `${w.label} · ${w.context}`;
      groups[key] = (groups[key] || 0) + 1;
    });
    panel.innerHTML = Object.entries(groups)
      .sort((a, b) => b[1] - a[1])
      .map(
        ([k, n]) =>
          `<div class="tracker-row"><span class="tracker-label">${k}</span><span class="tracker-n">×${n}</span></div>`
      )
      .join("");
  }

  function drillWrong() {
    // build a quick gauntlet from concepts seen wrong (best-effort mapping)
    const slots = [
      { label: "recall", generate: () => numericFromEngine() },
      { label: "recall", generate: () => CURRICULUM_propRandom() },
      { label: "recall", generate: () => genInvertTF() },
    ];
    runGauntlet(slots, "Re-drill · your misses", () => go(path.length - 1));
  }
  function numericFromEngine() {
    const g = Engine.gen3x3();
    return {
      type: "numeric",
      source: "Re-drill",
      promptHtml: "Compute the determinant:",
      matrix: g.M,
      answer: g.answer,
      solution: { steps: Engine.steps3x3(g.M).steps },
    };
  }
  function CURRICULUM_propRandom() {
    return propProblem(Engine.genScalarMultiple());
  }

  /* ---------- numeric parsing ---------- */
  function parseNumeric(str) {
    if (str == null) return NaN;
    const s = String(str).trim().replace(/\s+/g, "");
    if (s === "") return NaN;
    if (/^[-+]?\d+\/[-+]?\d+$/.test(s)) {
      const [a, b] = s.split("/").map(Number);
      if (b === 0) return NaN;
      return a / b;
    }
    const v = Number(s);
    return Number.isFinite(v) ? v : NaN;
  }
  const approx = (a, b) => Math.abs(a - b) < 1e-6;

  /* =================================================================
     SIDEBAR (stage map + free navigation)
  ================================================================= */
  function renderSidebar() {
    const sb = $("#stage-map");
    sb.innerHTML = "";
    path.forEach((node, idx) => {
      if (node.type === "done") return;
      const item = el("button", "map-item");
      if (idx === current) item.classList.add("active");
      if (state.completed[node.id]) item.classList.add("complete");

      let icon = "•";
      let title = node.label;
      let sub = "";
      if (node.type === "intro") {
        icon = "🚀";
        title = "Welcome";
      } else if (node.type === "concept") {
        icon = node.stage.id;
        title = node.stage.name;
        sub = "Learn";
        item.classList.add("stage-start");
      } else if (node.type === "guided") {
        icon = "✎";
        sub = "Guided";
        title = `${node.stage.name}`;
      } else if (node.type === "practice") {
        icon = "🎯";
        sub = "Practice";
        title = `${node.stage.name}`;
      } else if (node.type === "interleave") {
        icon = "🔁";
        title = "Spaced review";
      } else if (node.type === "mock") {
        icon = "🏆";
        title = "Boss gauntlet";
      }
      item.innerHTML = `<span class="map-icon">${icon}</span>
        <span class="map-text"><span class="map-title">${title}</span>${
          sub ? `<span class="map-sub">${sub}</span>` : ""
        }</span>${state.completed[node.id] ? '<span class="map-check">✓</span>' : ""}`;
      item.onclick = () => go(idx);
      sb.appendChild(item);
    });
  }

  /* =================================================================
     INIT
  ================================================================= */
  function init() {
    renderSidebar();
    renderTracker();
    renderNode(path[current]);

    // tracker toggle
    $("#tracker-toggle").onclick = () =>
      $("#tracker").classList.toggle("open");
    $("#tracker-clear").onclick = () => {
      state.wrongLog = [];
      saveState();
      renderTracker();
    };
    // reset progress
    $("#reset-progress").onclick = () => {
      if (confirm("Reset all progress and the wrong-answer tracker?")) {
        state.completed = {};
        state.wrongLog = [];
        saveState();
        go(0);
        renderTracker();
      }
    };
  }

  // expose a couple helpers used by curriculum-generated reteach (none needed globally now)
  window.__MA123 = { go };

  document.addEventListener("DOMContentLoaded", init);
})();

    </script>

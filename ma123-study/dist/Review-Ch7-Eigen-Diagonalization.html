   MA123 Lab 6 — Determinants  ::  Styles

<script>
//<![CDATA[
/* ===================================================================
   MA123 Lab 6 — Determinants Engine
   Pure math: determinant computation + verified step-by-step solution
   generators + interactive-matrix visualization state builders.

   Everything in here is data-in / data-out. The UI layer (app.js)
   turns the returned "step" objects into the on-screen step player.
   Keeping the math here means every guided walkthrough AND every
   auto-generated practice/reteach solution is guaranteed correct.
=================================================================== */

const Engine = (() => {
  /* ---------- number formatting helpers ---------- */
  const fmt = (n) => {
    // pass strings (symbolic entries like "x") straight through
    if (typeof n !== "number") return String(n);
    // keep small fractions readable, otherwise integers
    if (Number.isInteger(n)) return String(n);
    const r = Math.round(n * 1000) / 1000;
    return String(r);
  };
  // wrap negatives in parentheses for clean multiplication display
  const paren = (n) => (n < 0 ? `(${fmt(n)})` : fmt(n));

  /* ---------- matrix helpers ---------- */
  const clone = (M) => M.map((row) => row.slice());
  const size = (M) => M.length;

  const minor = (M, i, j) =>
    M.filter((_, r) => r !== i).map((row) => row.filter((_, c) => c !== j));

  // recursive determinant via first-row cofactor expansion (exact for ints)
  const det = (M) => {
    const n = M.length;
    if (n === 1) return M[0][0];
    if (n === 2) return M[0][0] * M[1][1] - M[0][1] * M[1][0];
    let total = 0;
    for (let j = 0; j < n; j++) {
      const sign = j % 2 === 0 ? 1 : -1;
      total += sign * M[0][j] * det(minor(M, 0, j));
    }
    return total;
  };

  /* ---------- LaTeX matrix rendering ---------- */
  // kind: 'b' => bmatrix (brackets), 'v' => vmatrix (det bars)
  const latexMatrix = (M, kind = "b", highlight = null) => {
    const env = kind === "v" ? "vmatrix" : "bmatrix";
    const body = M.map((row, r) =>
      row
        .map((val, c) => {
          let cell = fmt(val);
          if (
            highlight &&
            highlight.r === r &&
            (highlight.c === undefined || highlight.c === c)
          ) {
            cell = `\\boxed{${cell}}`;
          }
          return cell;
        })
        .join(" & ")
    ).join(" \\\\ ");
    return `\\begin{${env}}${body}\\end{${env}}`;
  };

  const tex = (s) => `\\(${s}\\)`;
  const texBlock = (s) => `\\[${s}\\]`;

  /* ===================================================================
     STEP GENERATORS
     A "step" = { title, html, viz } where viz is an optional config the
     visualizer in app.js can render (highlighting / crossing out cells).
  =================================================================== */

  /* ----- 2x2 determinant, fully worked ----- */
  const steps2x2 = (M) => {
    const [[a, b], [c, d]] = M;
    const result = a * d - b * c;
    return {
      result,
      steps: [
        {
          title: "Set up the 2×2 rule",
          html: `A 2×2 determinant is the <b>down-diagonal product minus the up-diagonal product</b>.
                 ${texBlock(`\\det${latexMatrix(M, "b")} = ad - bc`)}`,
          viz: { type: "two", M, phase: "setup" },
        },
        {
          title: "Mark the diagonals",
          html: `Green diagonal (top-left → bottom-right) is <b>+ad</b>.
                 Red diagonal (top-right → bottom-left) is <b>−bc</b>.`,
          viz: { type: "two", M, phase: "diagonals" },
        },
        {
          title: "Substitute the numbers",
          html: texBlock(
            `\\det(A) = (${fmt(a)})(${fmt(d)}) - (${fmt(b)})(${fmt(c)})`
          ),
          viz: { type: "two", M, phase: "diagonals" },
        },
        {
          title: "Compute",
          html: texBlock(
            `\\det(A) = ${fmt(a * d)} - (${fmt(b * c)}) = \\mathbf{${fmt(
              result
            )}}`
          ),
          viz: { type: "two", M, phase: "result", result },
        },
      ],
    };
  };

  /* ----- 3x3 determinant by cofactor expansion along row 0 ----- */
  const steps3x3 = (M, expandRow = 0) => {
    const n = 3;
    const row = expandRow;
    const result = det(M);
    const steps = [];

    steps.push({
      title: "Choose a row to expand along",
      html: `We use <b>cofactor expansion along row ${row + 1}</b>.
             The sign pattern (checkerboard) starts with + at the top-left:
             ${texBlock(`\\begin{matrix} + & - & + \\\\ - & + & - \\\\ + & - & + \\end{matrix}`)}
             Each term is <b>entry × sign × (determinant of the leftover 2×2)</b>.`,
      viz: { type: "cofactor", M, row, phase: "intro" },
    });

    const termPieces = [];
    for (let j = 0; j < n; j++) {
      const entry = M[row][j];
      const sgn = (row + j) % 2 === 0 ? 1 : -1;
      const sub = minor(M, row, j);
      const subDet = det(sub);
      const term = sgn * entry * subDet;
      termPieces.push({ entry, sgn, sub, subDet, term, j });

      steps.push({
        title: `Term ${j + 1}: cover row ${row + 1}, column ${j + 1}`,
        html: `Take the entry ${tex(fmt(entry))}. Its position sign is
               <b>${sgn === 1 ? "+" : "−"}</b>. Delete its row and column — the
               leftover 2×2 is its <b>minor</b>:
               ${texBlock(
                 `${sgn === 1 ? "+" : "-"}\\,(${paren(entry)})\\cdot${latexMatrix(
                   sub,
                   "v"
                 )}`
               )}`,
        viz: {
          type: "cofactor",
          M,
          row,
          phase: "term",
          col: j,
          sign: sgn,
          minor: sub,
        },
      });
    }

    // compute each 2x2 minor
    steps.push({
      title: "Evaluate each 2×2 minor",
      html: termPieces
        .map(
          (p) =>
            `${texBlock(
              `${latexMatrix(p.sub, "v")} = (${fmt(p.sub[0][0])})(${fmt(
                p.sub[1][1]
              )}) - (${fmt(p.sub[0][1])})(${fmt(p.sub[1][0])}) = ${fmt(p.subDet)}`
            )}`
        )
        .join(""),
      viz: { type: "cofactor", M, row, phase: "intro" },
    });

    // assemble
    const assembled = termPieces
      .map(
        (p) =>
          `${p.sgn === 1 ? "+" : "-"}\\,${paren(p.entry)}\\cdot(${fmt(
            p.subDet
          )})`
      )
      .join(" ");
    const numeric = termPieces
      .map((p) => `${p.term < 0 ? "-" : "+"}\\,${fmt(Math.abs(p.term))}`)
      .join(" ");

    steps.push({
      title: "Add the three terms",
      html: texBlock(`\\det(A) = ${assembled}`) +
            texBlock(`\\det(A) = ${numeric} = \\mathbf{${fmt(result)}}`),
      viz: { type: "cofactor", M, row, phase: "result", result },
    });

    return { result, steps };
  };

  /* ----- triangular determinant ----- */
  const stepsTriangular = (M) => {
    const n = M.length;
    const diag = M.map((row, i) => row[i]);
    const result = diag.reduce((a, b) => a * b, 1);
    return {
      result,
      steps: [
        {
          title: "Spot the triangular shape",
          html: `Every entry on one side of the main diagonal is 0, so this is a
                 <b>triangular matrix</b>. For triangular (and diagonal) matrices the
                 determinant is just the <b>product of the diagonal entries</b> — the
                 other entries do not matter at all.`,
          viz: { type: "diagonal", M, phase: "intro" },
        },
        {
          title: "Multiply the diagonal",
          html: texBlock(
            `\\det(A) = ${diag.map(paren).join(" \\cdot ")}`
          ),
          viz: { type: "diagonal", M, phase: "diag" },
        },
        {
          title: "Result",
          html: texBlock(`\\det(A) = \\mathbf{${fmt(result)}}`),
          viz: { type: "diagonal", M, phase: "result", result },
        },
      ],
    };
  };

  /* ===================================================================
     RANDOM PROBLEM GENERATORS  (for the practice gauntlet — infinite)
  =================================================================== */
  const ri = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const nz = (lo, hi) => {
    let v = 0;
    while (v === 0) v = ri(lo, hi);
    return v;
  };

  const gen2x2 = () => {
    const M = [
      [nz(-6, 6), ri(-6, 6)],
      [ri(-6, 6), nz(-6, 6)],
    ];
    return { M, answer: det(M), kind: "2x2" };
  };

  const gen3x3 = () => {
    // keep one zero in for friendlier arithmetic sometimes
    const M = [
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
      [ri(-4, 4), ri(-4, 4), ri(-4, 4)],
    ];
    return { M, answer: det(M), kind: "3x3" };
  };

  const genTriangular = (n = 3) => {
    const M = Array.from({ length: n }, () => Array(n).fill(0));
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        if (j < i) M[i][j] = ri(-5, 5); // lower triangular fill
        else if (j === i) M[i][j] = nz(-4, 4);
      }
    return { M, answer: det(M), kind: "triangular" };
  };

  // 4x4 with a sparse row to reward smart expansion
  const genSparse4 = () => {
    const M = [
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
      [0, nz(-3, 3), 0, 0],
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
      [ri(-3, 3), ri(-3, 3), ri(-3, 3), ri(-3, 3)],
    ];
    return { M, answer: det(M), kind: "sparse4" };
  };

  /* ----- property / algebra question generators (Stage C & D) ----- */
  // det(kA) = k^n det(A)
  const genScalarMultiple = () => {
    const n = ri(2, 3);
    const d = nz(-6, 6);
    const k = nz(-3, 3);
    const answer = Math.pow(k, n) * d;
    return {
      kind: "scalar",
      n,
      k,
      d,
      answer,
      prompt: `\\(A\\) is an \\(${n}\\times ${n}\\) matrix with \\(\\det(A) = ${d}\\). Find \\(\\det(${k}A)\\).`,
      reteach: `Scaling <b>every</b> row of an \\(n\\times n\\) matrix by \\(k\\) multiplies the determinant by \\(k\\) once per row — and there are \\(n\\) rows. So \\(\\det(kA)=k^{n}\\det(A)\\), NOT \\(k\\det(A)\\). Here \\(n=${n}\\), \\(k=${k}\\): \\(\\det(${k}A) = (${k})^{${n}}\\cdot(${d}) = ${Math.pow(
        k,
        n
      )}\\cdot(${d}) = ${answer}.\\) Watch the sign: a negative \\(k\\) with odd \\(n\\) stays negative.`,
    };
  };
  // det(AB) = det(A)det(B)
  const genProduct = () => {
    const a = nz(-6, 6);
    const b = nz(-6, 6);
    return {
      kind: "product",
      answer: a * b,
      prompt: `\\(\\det(A) = ${a}\\) and \\(\\det(B) = ${b}\\). Find \\(\\det(AB)\\).`,
      reteach: `The determinant of a product is the product of the determinants: \\(\\det(AB)=\\det(A)\\det(B) = (${a})(${b}) = ${
        a * b
      }.\\) (Order does not matter for the determinant: \\(\\det(AB)=\\det(BA)\\).)`,
    };
  };
  // det(A^{-1}) = 1/det(A)
  const genInverse = () => {
    const choices = [2, -2, 4, -4, 5, -5, 1, -1];
    const a = choices[ri(0, choices.length - 1)];
    const ans = 1 / a;
    return {
      kind: "inverse",
      answer: ans,
      prompt: `\\(\\det(A) = ${a}\\). Find \\(\\det(A^{-1})\\). (Enter a fraction like 1/2 if needed.)`,
      reteach: `Since \\(\\det(A)\\det(A^{-1}) = \\det(I) = 1\\), we get \\(\\det(A^{-1}) = \\dfrac{1}{\\det(A)} = \\dfrac{1}{${a}}.\\)`,
    };
  };

  return {
    fmt,
    paren,
    clone,
    size,
    minor,
    det,
    latexMatrix,
    tex,
    texBlock,
    steps2x2,
    steps3x3,
    stepsTriangular,
    gen2x2,
    gen3x3,
    genTriangular,
    genSparse4,
    genScalarMultiple,
    genProduct,
    genInverse,
  };
})();

<script>
//<![CDATA[
/* ===================================================================
   MA123 Study — Linear Algebra Engine Extension
   Attaches new, exact math to the shared Engine object:
     • Fraction (exact rational arithmetic)
     • rrefSteps: Gauss–Jordan with every row operation recorded
     • generators: span/independence/rank, matrix mult, dot/cross,
       eigenvalues (2×2 + triangular), transformations, linear systems
   All answers are computed, so practice + reteach are always correct.
=================================================================== */
(function (E) {
  /* ---------------- Fraction ---------------- */
  const gcd = (a, b) => {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { [a, b] = [b, a % b]; }
    return a || 1;
  };
  class Fr {
    constructor(n, d = 1) {
      if (d === 0) d = 1;
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d);
      this.n = n / g; this.d = d / g;
    }
    static from(x) { return x instanceof Fr ? x : new Fr(x, 1); }
    add(o) { o = Fr.from(o); return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { o = Fr.from(o); return new Fr(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { o = Fr.from(o); return new Fr(this.n * o.n, this.d * o.d); }
    div(o) { o = Fr.from(o); return new Fr(this.n * o.d, this.d * o.n); }
    neg() { return new Fr(-this.n, this.d); }
    isZero() { return this.n === 0; }
    isOne() { return this.n === this.d; }
    eq(o) { o = Fr.from(o); return this.n === o.n && this.d === o.d; }
    val() { return this.n / this.d; }
    tex() { return this.d === 1 ? String(this.n) : (this.n < 0 ? `-\\tfrac{${-this.n}}{${this.d}}` : `\\tfrac{${this.n}}{${this.d}}`); }
    str() { return this.d === 1 ? String(this.n) : `${this.n}/${this.d}`; }
  }

  const toFrMat = (M) => M.map((r) => r.map((x) => (x instanceof Fr ? x : new Fr(x, 1))));
  const frLatex = (M, kind = "b") => {
    const env = kind === "v" ? "vmatrix" : "bmatrix";
    return `\\begin{${env}}` +
      M.map((r) => r.map((x) => (x instanceof Fr ? x.tex() : String(x))).join(" & ")).join(" \\\\ ") +
      `\\end{${env}}`;
  };
  // augmented latex ([A | b]) with a vertical bar before last col(s)
  const augLatex = (M, splitAt) => {
    const cols = M[0].length;
    const spec = Array.from({ length: cols }, (_, i) => "c").join("");
    const withBar = spec.slice(0, splitAt) + "|" + spec.slice(splitAt);
    return `\\left[\\begin{array}{${withBar}}` +
      M.map((r) => r.map((x) => (x instanceof Fr ? x.tex() : String(x))).join(" & ")).join(" \\\\ ") +
      `\\end{array}\\right]`;
  };

  /* ---------------- RREF with recorded steps ---------------- */
  // returns { rank, pivots, R (Fr matrix), steps:[{desc, M(Fr)}] }
  function rrefSteps(input, opts = {}) {
    const M = toFrMat(input);
    const rows = M.length, cols = M[0].length;
    const splitAt = opts.splitAt; // for augmented display
    const steps = [];
    const snap = (desc) => steps.push({ desc, M: M.map((r) => r.map((x) => new Fr(x.n, x.d))) });
    snap("Start");
    let pivotRow = 0;
    const pivots = [];
    const limitCols = opts.coeffCols != null ? opts.coeffCols : cols;
    for (let col = 0; col < limitCols && pivotRow < rows; col++) {
      // find pivot
      let sel = -1;
      for (let r = pivotRow; r < rows; r++) if (!M[r][col].isZero()) { sel = r; break; }
      if (sel === -1) continue;
      if (sel !== pivotRow) {
        [M[sel], M[pivotRow]] = [M[pivotRow], M[sel]];
        snap(`R_{${pivotRow + 1}} \\leftrightarrow R_{${sel + 1}}`);
      }
      // scale pivot to 1
      if (!M[pivotRow][col].isOne()) {
        const p = M[pivotRow][col];
        M[pivotRow] = M[pivotRow].map((x) => x.div(p));
        snap(`\\tfrac{1}{${p.str()}}R_{${pivotRow + 1}} \\to R_{${pivotRow + 1}}`);
      }
      // eliminate other rows
      for (let r = 0; r < rows; r++) {
        if (r === pivotRow || M[r][col].isZero()) continue;
        const f = M[r][col];
        M[r] = M[r].map((x, j) => x.sub(f.mul(M[pivotRow][j])));
        snap(`R_{${r + 1}} - (${f.str()})R_{${pivotRow + 1}} \\to R_{${r + 1}}`);
      }
      pivots.push(col);
      pivotRow++;
    }
    return { rank: pivots.length, pivots, R: M, steps, splitAt };
  }

  // build stepPlayer steps from an rref run (each shown as a matrix + op)
  function rrefSolutionSteps(input, opts = {}) {
    const res = rrefSteps(input, opts);
    const steps = res.steps.map((s, i) => ({
      title: i === 0 ? "Write the matrix" : `Row operation`,
      html: (i === 0
        ? `Set it up, then reduce with row operations (each one shown):`
        : `Apply \\(${s.desc}\\):`) +
        E.texBlock(opts.splitAt != null ? augLatex(s.M, opts.splitAt) : frLatex(s.M)),
      viz: { type: "none" },
    }));
    steps.push({
      title: "Read off the result",
      html: `RREF reached. <b>rank = ${res.rank}</b>` +
        (opts.tail ? `<br>${opts.tail(res)}` : ""),
      viz: { type: "none" },
    });
    return { res, steps };
  }

  /* ---------------- vector / matrix helpers ---------------- */
  const ri = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const nz = (lo, hi) => { let v = 0; while (v === 0) v = ri(lo, hi); return v; };
  const colLatex = (v) => `\\begin{bmatrix}${v.join(" \\\\ ")}\\end{bmatrix}`;
  const rowsFromCols = (cols) => {
    const n = cols[0].length;
    return Array.from({ length: n }, (_, r) => cols.map((c) => c[r]));
  };
  const matMul = (A, B) => {
    const r = A.length, c = B[0].length, k = B.length;
    const out = Array.from({ length: r }, () => Array(c).fill(0));
    for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) { let s = 0; for (let t = 0; t < k; t++) s += A[i][t] * B[t][j]; out[i][j] = s; }
    return out;
  };
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  /* ============================================================
     GENERATORS
  ============================================================ */

  // Linear independence / rank of k vectors in R^n (columns)
  function genIndep(n = 3, k = 3, forceDependent = null) {
    let cols, rank, guard = 0;
    do {
      cols = Array.from({ length: k }, () => Array.from({ length: n }, () => ri(-3, 3)));
      // occasionally force a dependent set by making col3 = col1 + col2
      if (forceDependent === true || (forceDependent === null && Math.random() < 0.4 && k >= 2)) {
        cols[k - 1] = cols[0].map((x, i) => x + (cols[1] ? cols[1][i] : 0));
      }
      rank = rrefSteps(rowsFromCols(cols)).rank;
      guard++;
    } while (guard < 30 && ((forceDependent === true && rank === k) || (forceDependent === false && rank !== k)));
    const A = rowsFromCols(cols);
    const independent = rank === k;
    const sol = rrefSolutionSteps(A, {
      tail: (r) => independent
        ? `Since rank \\(= ${r.rank}\\) equals the number of vectors \\(k=${k}\\), the vectors are <b>linearly independent</b>.`
        : `Since rank \\(= ${r.rank} \\neq ${k}\\) (the number of vectors), the vectors are <b>linearly dependent</b>. Free variables: \\(k-\\text{rank} = ${k - r.rank}\\).`,
    });
    return { cols, A, rank, independent, sol };
  }

  function genIndepProblem() {
    const k = ri(2, 3), n = ri(k, 4);
    const g = genIndep(n, k);
    const vhtml = g.cols.map((c, i) => `\\vec v_{${i + 1}}=${colLatex(c)}`).join(",\\ ");
    return {
      type: "mc",
      source: "§5.2 (Lab 7)",
      promptHtml: `Are these vectors linearly independent? ${E.texBlock(vhtml)} <span class="mini-note">(Put them as columns, row-reduce, compare rank to the number of vectors.)</span>`,
      choices: [
        { html: "Linearly independent", correct: g.independent },
        { html: "Linearly dependent", correct: !g.independent },
      ],
      answer: g.independent ? 0 : 1,
      solution: { steps: g.sol.steps },
    };
  }

  function genRankProblem() {
    const rows = ri(2, 3), cols = ri(2, 4);
    const M = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ri(-3, 3)));
    const sol = rrefSolutionSteps(M, {});
    return {
      type: "numeric",
      source: "§5.2 (Lab 7)",
      promptHtml: `Find the <b>rank</b> of ${E.texBlock(E.latexMatrix(M, "b"))}`,
      answer: sol.res.rank,
      solution: { steps: sol.steps },
    };
  }

  // Is w in span(v1..vk)?  augmented [A|w] consistent?
  function genSpanMembership() {
    const n = ri(2, 3), k = ri(2, 3);
    const cols = Array.from({ length: k }, () => Array.from({ length: n }, () => ri(-3, 3)));
    const inSpan = Math.random() < 0.55;
    let w;
    if (inSpan) {
      const coeffs = Array.from({ length: k }, () => ri(-2, 2));
      w = cols[0].map((_, r) => cols.reduce((s, c, j) => s + c[r] * coeffs[j], 0));
    } else {
      w = Array.from({ length: n }, () => ri(-4, 4));
    }
    const aug = rowsFromCols(cols).map((r, i) => [...r, w[i]]);
    const res = rrefSteps(aug, { coeffCols: k, splitAt: k });
    // consistent iff no row [0..0 | nonzero]
    let consistent = true;
    for (const r of res.R) {
      const lhsZero = r.slice(0, k).every((x) => x.isZero());
      if (lhsZero && !r[k].isZero()) consistent = false;
    }
    const sol = rrefSolutionSteps(aug, {
      coeffCols: k, splitAt: k,
      tail: () => consistent
        ? `No row says \\(0 = \\text{nonzero}\\), so the system is <b>consistent</b> — \\(\\vec w\\) <b>is</b> in the span.`
        : `A row reads \\(0 = \\text{nonzero}\\), so the system is <b>inconsistent</b> — \\(\\vec w\\) is <b>not</b> in the span.`,
    });
    const vhtml = cols.map((c, i) => `\\vec v_{${i + 1}}=${colLatex(c)}`).join(",\\ ") + `,\\ \\vec w=${colLatex(w)}`;
    return {
      type: "mc",
      source: "§5.2 (Lab 7)",
      promptHtml: `Is \\(\\vec w\\) in \\(\\text{Span}(\\vec v_1,\\dots)\\)? ${E.texBlock(vhtml)}`,
      choices: [
        { html: "Yes — \\(\\vec w\\) is in the span", correct: consistent },
        { html: "No — \\(\\vec w\\) is not in the span", correct: !consistent },
      ],
      answer: consistent ? 0 : 1,
      solution: { steps: sol.steps },
    };
  }

  // Matrix multiplication — ask a specific entry
  function genMatMulEntry() {
    const m = ri(2, 3), n = ri(2, 3), p = ri(2, 3);
    const A = Array.from({ length: m }, () => Array.from({ length: n }, () => ri(-4, 4)));
    const B = Array.from({ length: n }, () => Array.from({ length: p }, () => ri(-4, 4)));
    const C = matMul(A, B);
    const i = ri(0, m - 1), j = ri(0, p - 1);
    const rowA = A[i], colB = B.map((r) => r[j]);

      nodes.push({ type: "concept", id: `${st.id}-concept`, stage: st, label: `Learn` });
      nodes.push({ type: "guided", id: `${st.id}-guided`, stage: st, label: `Guided` });
      nodes.push({ type: "practice", id: `${st.id}-practice`, stage: st, label: `Practice` });
      const inter = (CURRICULUM.interleave || {})[`after${st.id}`];
      if (inter)
        nodes.push({
          type: "interleave",
          id: `${st.id}-interleave`,
          data: inter,
          label: "Review",
        });
    });
    if (CURRICULUM.exam)
      nodes.push({ type: "exam", id: "exam", data: CURRICULUM.exam, label: "Exam" });
    if (CURRICULUM.mock)
      nodes.push({ type: "mock", id: "mock", data: CURRICULUM.mock, label: "Boss" });
    nodes.push({ type: "done", id: "done", label: "Finish" });
    return nodes;
  }

  /* =================================================================
     MATRIX VISUALIZER
  ================================================================= */
  function matrixGrid(M, opts = {}) {
    const n = M.length;
    const cols = M[0].length;
    const grid = el("div", "mx");
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    M.forEach((row, r) => {
      row.forEach((val, c) => {
        const cell = el("div", "mx-cell", String(val));
        if (opts.highlight && opts.highlight.r === r && opts.highlight.c === c)
          cell.classList.add("hl");
        if (opts.dimRow === r) cell.classList.add("dim");
        if (opts.dimCol === c) cell.classList.add("dim");
        if (opts.diag && r === c) cell.classList.add("diag");
        if (opts.greenDiag && r === c) cell.classList.add("green");
        if (opts.redAnti && r + c === n - 1) cell.classList.add("red");
        if (opts.changedRows && opts.changedRows.includes(r))
          cell.classList.add("changed");
        grid.appendChild(cell);
      });
    });
    return grid;
  }

  function renderViz(container, viz) {
    container.innerHTML = "";
    if (!viz || viz.type === "none") {
      container.appendChild(el("div", "viz-empty", "🧮"));
      return;
    }
    const wrap = el("div", "viz-wrap fade");

    if (viz.type === "two") {
      const opts = {};
      if (viz.phase === "diagonals") {
        opts.greenDiag = true;
        opts.redAnti = true;
      }
      wrap.appendChild(matrixGrid(viz.M, opts));
      if (viz.phase === "diagonals") {
        const legend = el(
          "div",
          "viz-legend",
          `<span class="chip green">+ad (down →)</span><span class="chip red">− bc (up ↗)</span>`
        );
        wrap.appendChild(legend);
      }
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det = ${viz.result}`));
    } else if (viz.type === "cofactor") {
      const opts = {};
      if (viz.phase === "term") {
        opts.highlight = { r: viz.row, c: viz.col };
        opts.dimRow = viz.row;
        opts.dimCol = viz.col;
      }
      wrap.appendChild(matrixGrid(viz.M, opts));
      if (viz.phase === "term") {
        const arrow = el("div", "viz-arrow", "↓ delete its row &amp; column");
        wrap.appendChild(arrow);
        const minorWrap = el("div", "viz-minor-wrap");
        const sign = el(
          "span",
          `sign-badge ${viz.sign === 1 ? "pos" : "neg"}`,
          viz.sign === 1 ? "+" : "−"
        );
        minorWrap.appendChild(sign);
        minorWrap.appendChild(matrixGrid(viz.minor, {}));
        wrap.appendChild(minorWrap);
      }
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det(A) = ${viz.result}`));
    } else if (viz.type === "diagonal") {
      wrap.appendChild(matrixGrid(viz.M, { diag: true }));
      if (viz.phase === "result")
        wrap.appendChild(el("div", "viz-result", `det = ${viz.result}`));
      else
        wrap.appendChild(
          el("div", "viz-legend", `<span class="chip diag-chip">multiply the diagonal</span>`)
        );
    } else if (viz.type === "signgrid") {
      const n = viz.n || 3;
      const grid = el("div", "mx sign-grid");
      grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++) {
          const s = (r + c) % 2 === 0 ? "+" : "−";
          const cell = el("div", `mx-cell sign ${s === "+" ? "pos" : "neg"}`, s);
          grid.appendChild(cell);
        }
      wrap.appendChild(grid);
      wrap.appendChild(
        el("div", "viz-legend", `<span class="chip">corners + center are +, edges are −</span>`)
      );
    } else if (viz.type === "rowop") {
      const row = el("div", "rowop");
      row.appendChild(matrixGrid(viz.before, {}));
      const mid = el("div", "rowop-mid");
      mid.appendChild(el("div", "rowop-op", `\\(${viz.op}\\)`));
      mid.appendChild(el("div", "rowop-arrow", "⟶"));
      const eff =
        viz.effect === "no change"
          ? "effect-ok"
          : viz.effect.includes("−1")
          ? "effect-flip"
          : "effect-scale";
      mid.appendChild(el("div", `rowop-effect ${eff}`, `det ${viz.effect}`));
      row.appendChild(mid);
      row.appendChild(matrixGrid(viz.after, {}));
      wrap.appendChild(row);
    } else if (viz.type === "matrixOnly") {
      wrap.appendChild(matrixGrid(viz.M, {}));
      if (viz.note) wrap.appendChild(el("div", "viz-legend", `<span class="chip">${viz.note}</span>`));
    }

    container.appendChild(wrap);
    typeset(container);
  }

  /* =================================================================
     STEP PLAYER  (one step at a time, Next/Back)
  ================================================================= */
  function stepPlayer(mountText, mountViz, steps, opts = {}) {
    let i = 0;
    const total = steps.length;

    const dots = el("div", "step-dots");
    for (let k = 0; k < total; k++) dots.appendChild(el("span", "dot"));

    const titleEl = el("div", "step-title");
    const bodyEl = el("div", "step-body");
    const nav = el("div", "step-nav");
    const back = el("button", "btn ghost", "‹ Back");
    const next = el("button", "btn primary", "Next step ›");
    const counter = el("span", "step-counter");
    nav.append(back, counter, next);

    mountText.innerHTML = "";
    mountText.append(dots, titleEl, bodyEl, nav);

    function render() {
      const s = steps[i];
      titleEl.textContent = `Step ${i + 1}. ${s.title}`;
      bodyEl.className = "step-body fade";
      bodyEl.innerHTML = s.html;
      // restart fade animation
      void bodyEl.offsetWidth;
      typeset(bodyEl);
      renderViz(mountViz, s.viz);
      counter.textContent = `${i + 1} / ${total}`;
      back.disabled = i === 0;
      [...dots.children].forEach((d, k) =>
        d.classList.toggle("on", k <= i)
      );
      next.textContent = i === total - 1 ? "Done ✓" : "Next step ›";
    }

    back.onclick = () => {
      if (i > 0) {
        i--;
        render();
      }
    };
    next.onclick = () => {
      if (i < total - 1) {
        i++;
        render();
      } else if (opts.onDone) {
        opts.onDone();
      }
    };
    render();
  }

    function loadProblem(idx) {
      gi = idx;
      const p = probs[idx];
      const built = p.build();
      // prepend a framing step that shows the problem
      const framing = {
        title: p.title,
        html: `${sourceTag(p.source)}<p class="prob-intro">${p.promptHtml}</p>`,
        viz: p.matrix ? { type: "matrixOnly", M: p.matrix, note: "" } : { type: "none" },
      };

      stepPlayer(left, right, steps, {

      });

    function buildControls(done) {
      controls.innerHTML = "";

        const d = el("button", "gdot" + (k === gi ? " on" : "") + (k < gi ? " seen" : ""), String(k + 1));

        dotline.appendChild(d);

      const row = el("div", "guided-btnrow");
      if (gi < probs.length - 1) {
        const nextProb = el("button", "btn primary", `Next worked problem (${gi + 2}/${probs.length}) ›`);
        nextProb.onclick = () => loadProblem(gi + 1);
        row.appendChild(nextProb);
      }
      // optional skip after 2 guided problems
      if (gi >= 1) {
        const skip = el("button", "btn accent", "I'm ready — skip to Practice ⏭");

          markComplete(node.id);
          go(current + 1);

          go(current + 1);

  function runExam(cfg, onDone) {
    const overlay = el("div", "overlay");
    document.body.appendChild(overlay);
    document.body.classList.add("locked");
    const results = []; // {prob, correct, picked}
    let idx = 0;
    const total = cfg.slots.length;

    // timer
    let seconds = 0;
    const timerEl = el("div", "exam-timer");
    let timerId = null;
    if (cfg.timed) {
      timerId = setInterval(() => {
        seconds++;
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        const over = cfg.timeLimitMin && seconds > cfg.timeLimitMin * 60;
        timerEl.textContent = `⏱ ${mm}:${ss}${over ? " (over target)" : ""}`;
        timerEl.classList.toggle("over", !!over);
      }, 1000);
    }

    function showQuestion() {
      if (idx >= total) return gradeExam();
      const slot = cfg.slots[idx];
      const prob = slot.generate();
      overlay.innerHTML = "";
      const modal = el("div", "modal fade");
      const top = el("div", "modal-top");
      top.innerHTML = `<div class="modal-context">${cfg.title}</div>
        <div class="modal-progress">Question ${idx + 1} / ${total}</div>`;
      modal.appendChild(top);
      if (cfg.timed) modal.appendChild(timerEl);
      const note = el("div", "lock-note", cfg.notesAllowed
        ? "📖 Notes allowed. Commit to an answer — you'll be graded at the end."
        : "🚫 Closed book — no notes, no AI, no internet.");
      modal.appendChild(note);
      const qcard = el("div", "qcard");
      qcard.innerHTML = `${slot.source ? sourceTag(slot.source) : prob.source ? sourceTag(prob.source) : ""}
        <div class="qprompt">${prob.promptHtml || "Solve:"}</div>`;
      if (prob.matrix) { const w = el("div", "qmatrix"); w.innerHTML = `\\[${Engine.latexMatrix(prob.matrix, "v")}\\]`; qcard.appendChild(w); }
      modal.appendChild(qcard);
      const zone = el("div", "answer-zone");
      modal.appendChild(zone);
      overlay.appendChild(modal);
      typeset(modal);
      if (/[?&]test=1/.test(location.search)) window.__currentProb = prob;

      const record = (correct, picked) => {
        results.push({ prob, correct, picked, slot });
        if (!correct) logWrong(prob, cfg.title);
        idx++;
        showQuestion();
      };

      buildAnswerInputs(zone, prob, record, /*examMode*/ true);
    }

    function gradeExam() {
      if (timerId) clearInterval(timerId);
      const score = results.filter((r) => r.correct).length;
      overlay.innerHTML = "";
      const modal = el("div", "modal fade");
      const pct = Math.round((score / total) * 100);
      modal.innerHTML = `<div class="modal-top"><div class="modal-context">${cfg.title}</div>
        <div class="modal-progress">Score report</div></div>
        <div class="exam-score">${score} / ${total} &nbsp;·&nbsp; ${pct}%${cfg.timed ? ` &nbsp;·&nbsp; ⏱ ${Math.floor(seconds/60)}m ${seconds%60}s` : ""}</div>`;
      const wrong = results.filter((r) => !r.correct);
      if (!wrong.length) {
        modal.innerHTML += `<p class="exam-allright">🏆 Perfect. Every question correct.</p>`;
        const done = el("button", "btn primary big", "Finish ✓");
        done.onclick = () => { overlay.remove(); document.body.classList.remove("locked"); onDone(); };
        modal.appendChild(done);
        overlay.appendChild(modal);
        typeset(modal);
        return;
      }
      modal.innerHTML += `<p class="exam-review-intro">Let's walk through what you missed. Each gets a full explanation and one follow-up question.</p>`;
      const startReview = el("button", "btn primary big", `Review ${wrong.length} missed question${wrong.length > 1 ? "s" : ""} ›`);
      startReview.onclick = () => reviewWrong(wrong, 0);
      modal.appendChild(startReview);
      overlay.appendChild(modal);
      typeset(modal);

      function reviewWrong(list, i) {
        if (i >= list.length) { overlay.remove(); document.body.classList.remove("locked"); onDone(); return; }
        const { prob } = list[i];
        overlay.innerHTML = "";
        const md = el("div", "modal fade");
        md.innerHTML = `<div class="modal-top"><div class="modal-context">Review ${i + 1}/${list.length}</div>
          <div class="modal-progress">Full walkthrough</div></div>
          <div class="qcard"><div class="qprompt">${prob.promptHtml || "Solve:"}</div>
          ${prob.matrix ? `<div class="qmatrix">\\[${Engine.latexMatrix(prob.matrix, "v")}\\]</div>` : ""}</div>`;
        const reteach = el("div", "reteach");
        renderReteach(reteach, prob);
        md.appendChild(reteach);
        // follow-up question from the SAME slot generator
        const followWrap = el("div", "followup");
        followWrap.innerHTML = `<div class="followup-head">🎯 Follow-up — try one more like it (no notes):</div>`;
        md.appendChild(followWrap);
        overlay.appendChild(md);
        typeset(md);
        const followProb = list[i].slot.generate();
        const fzone = el("div", "answer-zone");
        followWrap.appendChild(fzone);
        typeset(fzone);
        buildAnswerInputs(fzone, followProb, (correct) => {
          const fb = el("div", `feedback ${correct ? "ok-fb" : "bad-fb"} show`);
          fb.innerHTML = correct ? "✅ Got it." : "❌ Still off — the full method is above; keep this one in your tracker.";
          if (!correct) logWrong(followProb, cfg.title + " (follow-up)");
          followWrap.appendChild(fb);
          const nb = el("button", "btn primary big", i + 1 >= list.length ? "Finish review ✓" : "Next review ›");
          nb.onclick = () => reviewWrong(list, i + 1);
          fb.appendChild(el("div", "spacer"));
          fb.appendChild(nb);
          typeset(fb);
        }, true);
      }
    }

    showQuestion();
  }

  // shared input builder used by exam (and could be reused)
  function buildAnswerInputs(zone, prob, done, examMode) {
    prob.__examMode = examMode;
    if (prob.type === "tf") {
      const row = el("div", "tf-row");
      const t = el("button", "btn choice", "TRUE");
      const f = el("button", "btn choice", "FALSE");
      t.onclick = () => finish(true === prob.answer, true);
      f.onclick = () => finish(false === prob.answer, false);
      row.append(t, f);
      zone.appendChild(row);
    } else if (prob.type === "mc") {
      const list = el("div", "mc-list");
      prob.choices.forEach((ch, k) => {
        const b = el("button", "btn choice mc", ch.html);
        b.onclick = () => finish(k === prob.answer, k);
        list.appendChild(b);
      });
      zone.appendChild(list);
      typeset(zone);
    } else {
      const row = el("div", "num-row");
      const input = el("input", "num-input");
      input.type = "text";
      input.placeholder = "your answer (e.g. -6 or 1/2)";
      const submit = el("button", "btn primary", "Submit");
      const go = () => {
        const v = parseNumeric(input.value);
        if (Number.isNaN(v)) { input.classList.add("err"); return; }
        finish(approx(v, prob.answer), input.value);
      };
      submit.onclick = go;
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      row.append(input, submit);
      zone.appendChild(row);
      setTimeout(() => input.focus(), 40);
    }
    const idk = el("button", "btn idk", "I don't know");
    idk.onclick = () => finish(false, "IDK");
    zone.appendChild(idk);

    function finish(correct, picked) {
      zone.querySelectorAll("button, input").forEach((n) => (n.disabled = true));
      if (examMode) {
        const fb = el("div", `feedback ${correct ? "ok-fb" : "bad-fb"} show`);
        fb.textContent = correct ? "✓ recorded" : "✗ recorded";
        zone.appendChild(fb);
        setTimeout(() => done(correct, picked), 350);
      } else {
        done(correct, picked);
      }
    }
  }

  /* ----- done ----- */
  function renderDone(m) {
    const meta = CURRICULUM.meta;
    const wrongCount = state.wrongLog.length;
    const card = el("div", "card hero");
    card.innerHTML = `<div class="kicker">${meta.lab || meta.title || "MA123"}</div>
      <h1>${meta.doneTitle || "You made it 🎓"}</h1>
      <p class="lede">${meta.doneText || "You've worked through everything in this guide — all by hand."}</p>
      <div class="meta-row">
        <div class="meta-pill">Sections cleared: ${(CURRICULUM.stages || []).length}</div>
        <div class="meta-pill">Logged misses: ${wrongCount}</div>
      </div>
      <p>Best next move: open the <b>Wrong-Answer Tracker</b> and re-run any concept that shows
        up there. Recall beats re-reading.</p>`;
    m.appendChild(card);
    const row = el("div", "guided-btnrow");
    const restart = el("button", "btn ghost", "↺ Restart from the top");
    restart.onclick = () => go(0);
    const replayWrong = el("button", "btn accent", "Re-drill my missed concepts ▶");
    replayWrong.onclick = () => drillWrong();
    row.append(replayWrong, restart);
    m.appendChild(row);
    typeset(m);
  }

  /* =================================================================
     THE GAUNTLET  (locked modal, one question at a time)
  ================================================================= */
  function runGauntlet(slots, contextLabel, onAllDone) {
    const overlay = el("div", "overlay");
    document.body.appendChild(overlay);
    document.body.classList.add("locked");

    let slotIndex = 0;
    let cleared = 0;
    const totalSlots = slots.length;

    function nextSlot() {
      if (slotIndex >= totalSlots) {
        // finished
        overlay.remove();
        document.body.classList.remove("locked");
        onAllDone();
        return;
      }
      showProblem(slots[slotIndex]);
    }

    function showProblem(slot) {
      const prob = slot.generate();
      overlay.innerHTML = "";
      const modal = el("div", "modal fade");

      const top = el("div", "modal-top");
      top.innerHTML = `<div class="modal-context">${contextLabel}</div>
        <div class="modal-progress">Question ${slotIndex + 1} / ${totalSlots} · cleared ${cleared}</div>`;
      modal.appendChild(top);

      const lockNote = el("div", "lock-note", "🔒 Locked — no AI, no internet. Answer to continue.");
      modal.appendChild(lockNote);

      const qcard = el("div", "qcard");
      qcard.innerHTML = `${slot.source ? sourceTag(slot.source) : prob.source ? sourceTag(prob.source) : ""}
        <div class="qprompt">${prob.promptHtml || "Compute the determinant:"}</div>`;
      if (prob.matrix) {
        const mwrap = el("div", "qmatrix");
        mwrap.innerHTML = `\\[${Engine.latexMatrix(prob.matrix, "v")}\\]`;
        qcard.appendChild(mwrap);
      }
      modal.appendChild(qcard);

      const answerZone = el("div", "answer-zone");
      modal.appendChild(answerZone);

      const feedback = el("div", "feedback");
      modal.appendChild(feedback);

      overlay.appendChild(modal);
      typeset(modal);

      // test-only probe (active only with ?test=1 in the URL) so automated
      // tests can verify the correct-answer path. Never set during normal use.
      if (/[?&]test=1/.test(location.search)) window.__currentProb = prob;

      // build inputs per type
      if (prob.type === "tf") {
        const row = el("div", "tf-row");
        const tBtn = el("button", "btn choice", "TRUE");
        const fBtn = el("button", "btn choice", "FALSE");
        tBtn.onclick = () => judge(true === prob.answer, prob, feedback, answerZone, slot, true);
        fBtn.onclick = () => judge(false === prob.answer, prob, feedback, answerZone, slot, false);
        row.append(tBtn, fBtn);
        answerZone.appendChild(row);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
      } else if (prob.type === "mc") {
        const list = el("div", "mc-list");
        prob.choices.forEach((ch, k) => {
          const b = el("button", "btn choice mc", ch.html);
          b.onclick = () => judge(k === prob.answer, prob, feedback, answerZone, slot, k);
          list.appendChild(b);
        });
        answerZone.appendChild(list);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
        typeset(answerZone);
      } else {
        // numeric
        const row = el("div", "num-row");
        const input = el("input", "num-input");
        input.type = "text";
        input.setAttribute("inputmode", "text");
        input.placeholder = "your answer (e.g. -6 or 1/2)";
        const submit = el("button", "btn primary", "Submit");
        const tryJudge = () => {
          const v = parseNumeric(input.value);
          if (Number.isNaN(v)) {
            feedback.className = "feedback warn-fb show";
            feedback.textContent = "Type a number (integer, decimal, or a/b fraction).";
            return;
          }
          judge(approx(v, prob.answer), prob, feedback, answerZone, slot, input.value);
        };
        submit.onclick = tryJudge;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") tryJudge();
        });
        row.append(input, submit);
        answerZone.appendChild(row);
        answerZone.appendChild(idkButton(prob, feedback, answerZone, slot));
        setTimeout(() => input.focus(), 50);
      }
    }

    function idkButton(prob, feedback, answerZone, slot) {
      const b = el("button", "btn idk", "I don't know");
      b.onclick = () => judge(false, prob, feedback, answerZone, slot, "IDK", true);
      return b;
    }

    function judge(correct, prob, feedback, answerZone, slot, picked, isIDK) {
      // disable inputs
      answerZone.querySelectorAll("button, input").forEach((n) => (n.disabled = true));
      if (correct) {
        feedback.className = "feedback ok-fb show";
        feedback.innerHTML = `✅ Correct.`;
        // if MC/correct, optionally show why
        const cont = el("button", "btn primary big", slotIndex + 1 >= totalSlots ? "Finish ✓" : "Next question ›");
        cont.onclick = () => {
          cleared++;
          slotIndex++;
          nextSlot();
        };
        feedback.appendChild(el("div", "spacer"));
        feedback.appendChild(cont);
      } else {
        // log the miss
        logWrong(prob, contextLabel);
        feedback.className = "feedback bad-fb show";
        feedback.innerHTML = isIDK
          ? `🟡 No problem — let's learn it. Here's the full reasoning:`
          : `❌ Not quite. Here's exactly how it works:`;
        const reteach = el("div", "reteach");
        renderReteach(reteach, prob);
        feedback.appendChild(reteach);

        const again = el("button", "btn primary big", "Got it — give me a fresh one ↻");
        again.onclick = () => showProblem(slot); // brand new variant, same slot
        feedback.appendChild(el("div", "spacer"));
        feedback.appendChild(again);
        typeset(feedback);
      }
    }

    nextSlot();
  }

  function renderReteach(container, prob) {
    if (prob.solution && prob.solution.steps) {
      // mini step player inside the reteach
      const wrap = el("div", "reteach-grid");
      const txt = el("div", "reteach-text");
      const viz = el("div", "reteach-viz");
      wrap.append(txt, viz);
      container.appendChild(wrap);
      stepPlayer(txt, viz, prob.solution.steps, {});
    } else if (prob.reteachHtml) {
      container.innerHTML = `<div class="reteach-plain">${prob.reteachHtml}</div>`;
      typeset(container);
    } else if (prob.type === "mc" && prob.choices) {
      const correct = prob.choices[prob.answer];
      container.innerHTML = `<div class="reteach-plain">Correct choice: <b>${correct.html}</b>${
        correct.why ? `<br>${correct.why}` : ""
      }</div>`;
      typeset(container);
    } else {
      container.innerHTML = `<div class="reteach-plain">The correct answer is <b>${prob.answer}</b>.</div>`;
    }
  }

  /* ---------- wrong-answer tracker ---------- */
  function logWrong(prob, context) {
    const label =
      prob.type === "tf"
        ? "True/False trap"
        : prob.type === "mc"
        ? "Concept choice"
        : prob.matrix
        ? "Determinant computation"
        : "Determinant property";
    state.wrongLog.unshift({
      label,
      source: prob.source || "—",
      context,
      when: Date.now(),
    });
    if (state.wrongLog.length > 60) state.wrongLog.pop();
    saveState();
    renderTracker();
  }

  function renderTracker() {
    const panel = $("#tracker-body");
    if (!panel) return;
    const log = state.wrongLog;
    $("#tracker-count").textContent = log.length;
    if (!log.length) {
      panel.innerHTML = `<div class="tracker-empty">No misses yet. 🎯<br><span>Anything you miss in a gauntlet lands here so you can re-drill it.</span></div>`;
      return;
    }
    // group by label+context
    const groups = {};
    log.forEach((w) => {
      const key = `${w.label} · ${w.context}`;
      groups[key] = (groups[key] || 0) + 1;
    });
    panel.innerHTML = Object.entries(groups)
      .sort((a, b) => b[1] - a[1])
      .map(
        ([k, n]) =>
          `<div class="tracker-row"><span class="tracker-label">${k}</span><span class="tracker-n">×${n}</span></div>`
      )
      .join("");
  }

  function drillWrong() {
    // gather every practice/mock/exam slot generator in this HTML and sample from them
    const gens = [];
    (CURRICULUM.stages || []).forEach((st) =>
      (st.practice && st.practice.slots || []).forEach((s) => gens.push(s)));
    Object.values(CURRICULUM.interleave || {}).forEach((iv) =>
      (iv.slots || []).forEach((s) => gens.push(s)));
    if (CURRICULUM.mock) (CURRICULUM.mock.slots || []).forEach((s) => gens.push(s));
    if (CURRICULUM.exam) (CURRICULUM.exam.slots || []).forEach((s) => gens.push(s));
    const pick = gens.length ? gens : [{ label: "recall", generate: () => {
      const g = Engine.gen3x3();
      return { type: "numeric", source: "Re-drill", promptHtml: "Compute the determinant:", matrix: g.M, answer: g.answer, solution: { steps: Engine.steps3x3(g.M).steps } };
    } }];
    const chosen = pick.sort(() => Math.random() - 0.5).slice(0, Math.min(5, pick.length));
    runGauntlet(chosen, "Re-drill · your misses", () => go(path.length - 1));
  }

  /* ---------- numeric parsing ---------- */
  function parseNumeric(str) {
    if (str == null) return NaN;
    const s = String(str).trim().replace(/\s+/g, "");
    if (s === "") return NaN;
    if (/^[-+]?\d+\/[-+]?\d+$/.test(s)) {
      const [a, b] = s.split("/").map(Number);
      if (b === 0) return NaN;
      return a / b;
    }
    const v = Number(s);
    return Number.isFinite(v) ? v : NaN;
  }
  const approx = (a, b) => Math.abs(a - b) < 1e-6;

  /* =================================================================
     SIDEBAR (stage map + free navigation)
  ================================================================= */
  function renderSidebar() {
    const sb = $("#stage-map");
    sb.innerHTML = "";
    path.forEach((node, idx) => {
      if (node.type === "done") return;
      const item = el("button", "map-item");
      if (idx === current) item.classList.add("active");
      if (state.completed[node.id]) item.classList.add("complete");

      let icon = "•";
      let title = node.label;
      let sub = "";
      if (node.type === "intro") {
        icon = "🚀";
        title = "Welcome";
      } else if (node.type === "concept") {
        icon = node.stage.id;
        title = node.stage.name;
        sub = "Learn";
        item.classList.add("stage-start");
      } else if (node.type === "guided") {
        icon = "✎";
        sub = "Guided";
        title = `${node.stage.name}`;
      } else if (node.type === "practice") {
        icon = "🎯";
        sub = "Practice";
        title = `${node.stage.name}`;
      } else if (node.type === "interleave") {
        icon = "🔁";
        title = "Spaced review";
      } else if (node.type === "mock") {
        icon = "🏆";
        title = "Boss gauntlet";
      }
      item.innerHTML = `<span class="map-icon">${icon}</span>
        <span class="map-text"><span class="map-title">${title}</span>${
          sub ? `<span class="map-sub">${sub}</span>` : ""
        }</span>${state.completed[node.id] ? '<span class="map-check">✓</span>' : ""}`;
      item.onclick = () => go(idx);
      sb.appendChild(item);
    });
  }

  /* =================================================================
     INIT
  ================================================================= */
  function init() {
    renderSidebar();
    renderTracker();
    renderNode(path[current]);

    // tracker toggle
    $("#tracker-toggle").onclick = () =>
      $("#tracker").classList.toggle("open");
    $("#tracker-clear").onclick = () => {
      state.wrongLog = [];
      saveState();
      renderTracker();
    };
    // reset progress
    $("#reset-progress").onclick = () => {
      if (confirm("Reset all progress and the wrong-answer tracker?")) {
        state.completed = {};
        state.wrongLog = [];
        saveState();
        go(0);
        renderTracker();
      }
    };
  }

  // expose a couple helpers used by curriculum-generated reteach (none needed globally now)
  window.__MA123 = { go };

  document.addEventListener("DOMContentLoaded", init);
})();

//]]>
</script>
</body></html>
